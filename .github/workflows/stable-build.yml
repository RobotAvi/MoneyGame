name: 🚀 Stable Build & Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'releases/debug/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.configureondemand=true
    -Dorg.gradle.caching=true
    -Dorg.gradle.workers.max=4
    -Dorg.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"

jobs:
  setup-android-sdk:
    runs-on: ubuntu-latest
    outputs:
      sdk-path: /usr/local/lib/android/sdk
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      date: ${{ steps.date.outputs.date }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📅 Get current date
        id: date
        run: echo "date=$(date '+%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
        
      - name: 🔖 Get version info
        id: version
        run: |
          echo "🔍 ==== ПОЛУЧЕНИЕ ВЕРСИИ ===="
          echo "🔍 Проверяем существование app/build.gradle..."
          ls -la app/build.gradle || echo "❌ app/build.gradle не найден"
          
          echo "🔍 Содержимое app/build.gradle:"
          cat app/build.gradle | grep -E "(versionName|versionCode)" || echo "❌ Не найдены versionName или versionCode"
          
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          VERSION_CODE=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle)
          
          echo "🔍 Извлеченная версия: $VERSION"
          echo "🔍 Извлеченный код версии: $VERSION_CODE"
          
          if [ -z "$VERSION" ]; then
            echo "❌ ОШИБКА: Не удалось извлечь versionName"
            exit 1
          fi
          if [ -z "$VERSION_CODE" ]; then
            echo "❌ ОШИБКА: Не удалось извлечь versionCode"
            exit 1
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "✅ Версия успешно извлечена: $VERSION ($VERSION_CODE)"

      - name: 🗄️ Cache Android SDK
        id: cache-sdk-setup
        uses: actions/cache@v3
        with:
          path: |
            ~/.android/cache
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.ANDROID_SDK_ROOT }}
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/build.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: 🛠️ Setup Android SDK (Cached)
        if: steps.cache-sdk-setup.outputs.cache-hit != 'true'
        run: |
          echo "🔧 ==== УСТАНОВКА ANDROID SDK (если не в кэше) ===="
          set -x
          
          # Проверяем, установлен ли уже SDK
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ] && [ -f "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "✅ Android SDK уже установлен, пропускаем установку"
            echo "🔧 Настройка переменных окружения..."
            export PATH="$PATH:$ANDROID_SDK_ROOT/emulator:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          else
            echo "🔧 Android SDK не найден, начинаем установку..."
            
            echo "🔧 Очистка существующих файлов..."
            rm -rf $HOME/cmdline-tools.zip $HOME/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
            
            echo "🔧 Обновление пакетов..."
            sudo apt-get update
            
            echo "🔧 Установка wget и unzip..."
            sudo apt-get install -y wget unzip
            
            echo "🔧 Загрузка commandline tools..."
            wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
            
            echo "🔧 Распаковка commandline tools..."
            unzip cmdline-tools.zip -d $HOME
            
            echo "🔧 Создание структуры директорий..."
            mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
            
            # Удаляем существующую директорию, если она есть
            if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
              echo "🔧 Удаление существующей директории latest..."
              rm -rf $ANDROID_SDK_ROOT/cmdline-tools/latest
            fi
            
            mv $HOME/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
            
            echo "🔧 Настройка переменных окружения..."
            export PATH="$PATH:$ANDROID_SDK_ROOT/emulator:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
            
            echo "🔧 Принятие лицензий..."
            yes | sdkmanager --licenses || { echo "❌ ОШИБКА: sdkmanager license error"; exit 1; }
            
            echo "🔧 Установка компонентов SDK..."
            yes | sdkmanager --install "platform-tools" "emulator" "system-images;android-34;default;x86_64" || { echo "❌ ОШИБКА: sdkmanager install error"; exit 1; }
            echo "🔧 Проверка установки компонентов..."
            sdkmanager --list | grep -E "platform-tools|emulator|system-images;android-34" || { echo "❌ ОШИБКА: Компоненты не установлены"; exit 1; }
            
            echo "🔧 Установка прав на выполнение..."
            sudo chmod -R +x $ANDROID_SDK_ROOT/platform-tools/ || echo "⚠️ Не удалось установить права для platform-tools"
            sudo chmod -R +x $ANDROID_SDK_ROOT/emulator/ || echo "⚠️ Не удалось установить права для emulator"
            sudo chmod -R +x $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/ || echo "⚠️ Не удалось установить права для cmdline-tools"
            
            echo "🔧 Проверка прав на выполнение..."
            ls -la $ANDROID_SDK_ROOT/platform-tools/adb || echo "❌ adb не найден"
            ls -la $ANDROID_SDK_ROOT/emulator/emulator || echo "❌ emulator не найден"
            ls -la $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager || echo "❌ sdkmanager не найден"
            
            echo "✅ Android SDK установлен и готов к использованию"
          fi


  # Сборка и тестирование APK
  build-and-test:
    runs-on: ubuntu-latest
    needs: setup-android-sdk
    env:
      ANDROID_SDK_ROOT: ${{ needs.setup-android-sdk.outputs.sdk-path }}
      ANDROID_HOME: ${{ needs.setup-android-sdk.outputs.sdk-path }}
    outputs:
      version: ${{ needs.setup-android-sdk.outputs.version }}
      version_code: ${{ needs.setup-android-sdk.outputs.version_code }}
      date: ${{ needs.setup-android-sdk.outputs.date }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: Remove default GitHub Actions credentials
        run: git config --local --remove-section http."https://github.com/" || true
        
      - name: 🗄️ Cache Gradle dependencies
        id: cache-gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔧 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          

          
      - name: 🔧 Проверка SDK для сборки
        run: |
          echo "🔧 ==== ПРОВЕРКА SDK ДЛЯ СБОРКИ ===="
          echo "🔧 ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo "🔧 Проверяем существование SDK:"
          ls -la $ANDROID_SDK_ROOT/ || echo "❌ SDK не найден"
          
          echo "🔧 Проверка наличия platform-tools..."
          ls -la $ANDROID_SDK_ROOT/platform-tools/adb || echo "❌ adb не найден"
          
          echo "🔧 Тест adb:"
          $ANDROID_SDK_ROOT/platform-tools/adb version || echo "❌ adb version failed"
          
      - name: 🏗️ Build APK
        run: |
          echo "🏗️ ==== СБОРКА APK ===="
          echo "🏗️ Настройка переменных окружения..."
          # Используем переменные, переданные из setup-android-sdk
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          
          echo "🏗️ ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo "🏗️ ANDROID_HOME: $ANDROID_HOME"
          echo "🏗️ PATH: $PATH"
          
          echo "🏗️ Проверка Gradle wrapper..."
          ls -la ./gradlew || echo "❌ gradlew не найден"
          chmod +x ./gradlew || echo "⚠️ Не удалось установить права на gradlew"
          
          echo "🏗️ Проверка app/build.gradle..."
          ls -la app/build.gradle || echo "❌ app/build.gradle не найден"
          cat app/build.gradle | grep -E "(versionName|versionCode|applicationId)" || echo "❌ Не найдены ключевые параметры"
          
          echo "🏗️ Очистка проекта..."
          ./gradlew clean || { echo "❌ ОШИБКА: gradlew clean failed"; exit 1; }
          
          echo "🏗️ Сборка debug APK..."
          ./gradlew assembleDebug || { echo "❌ ОШИБКА: gradlew assembleDebug failed"; exit 1; }
          
          echo "🏗️ ==== ПРОВЕРКА СОБРАННОГО APK ===="
          echo "🏗️ Поиск APK файлов..."
          find . -name "*.apk" -type f || echo "❌ APK файлы не найдены"
          
          echo "🏗️ Проверка app/build/outputs/apk/debug/..."
          ls -la app/build/outputs/apk/debug/ || echo "❌ debug APK директория не найдена"
          
          echo "🏗️ Создание директории releases/debug..."
          mkdir -p releases/debug
          
          echo "🏗️ Копирование APK..."
          cp app/build/outputs/apk/debug/app-debug.apk releases/debug/latest-debug.apk || { echo "❌ ОШИБКА: Не удалось скопировать APK"; exit 1; }
          
          echo "🏗️ Проверка скопированного APK..."
          ls -la releases/debug/latest-debug.apk || echo "❌ APK не найден в releases/debug/"
          
          echo "🏗️ Размер APK:"
          du -h releases/debug/latest-debug.apk || echo "❌ Не удалось получить размер APK"
          
          echo "🏗️ Проверка APK через aapt..."
          $ANDROID_SDK_ROOT/build-tools/*/aapt dump badging releases/debug/latest-debug.apk | head -10 || echo "❌ aapt failed"
          
      - name: 🏗️ Копировать apk с красивым именем
        run: |
          VERSION="${{ needs.setup-android-sdk.outputs.version }}"
          DATE="${{ needs.setup-android-sdk.outputs.date }}"
          cp app/build/outputs/apk/debug/app-debug.apk "releases/debug/FinancialSuccess-v${VERSION}-${DATE}-debug.apk"

      - name: 📦 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinancialSuccess-v${{ needs.setup-android-sdk.outputs.version }}-${{ needs.setup-android-sdk.outputs.date }}-debug.apk
          path: releases/debug/FinancialSuccess-v${{ needs.setup-android-sdk.outputs.version }}-${{ needs.setup-android-sdk.outputs.date }}-debug.apk

      - name: Bump version in build.gradle
        run: |
          VERSION_LINE=$(grep -n 'versionName' app/build.gradle | cut -d: -f1)
          CODE_LINE=$(grep -n 'versionCode' app/build.gradle | cut -d: -f1)
          CURR_VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          CURR_CODE=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle)
          NEW_CODE=$((CURR_CODE+1))
          # Увеличиваем минорную версию
          MAJOR=$(echo $CURR_VERSION | cut -d. -f1)
          MINOR=$(echo $CURR_VERSION | cut -d. -f2)
          if [ -z "$MINOR" ]; then MINOR=0; fi
          NEW_MINOR=$((MINOR+1))
          NEW_VERSION="$MAJOR.$NEW_MINOR"
          sed -i "${CODE_LINE}s/versionCode.*/versionCode $NEW_CODE/" app/build.gradle
          sed -i "${VERSION_LINE}s/versionName.*/versionName \"$NEW_VERSION\"/" app/build.gradle
          echo "Bumped version to $NEW_VERSION ($NEW_CODE)"

      - name: Commit APK and version bump to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/debug/*.apk app/build.gradle
          git commit -m "Update APK and bump version [skip ci]"
          git push https://x-access-token:${GH_PAT}@github.com/RobotAvi/MoneyGame.git HEAD:main
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

  prepare-emulator:
    needs: setup-android-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Увеличиваем таймаут до 20 минут
    env:
      ACTIONS_CACHE_DEBUG: true
      ACTIONS_STEP_DEBUG: true
      ANDROID_SDK_ROOT: ${{ needs.setup-android-sdk.outputs.sdk-path }}
      ANDROID_HOME: ${{ needs.setup-android-sdk.outputs.sdk-path }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      - name: 📊 Setup and debug cache paths
        run: |
          echo "==== SETUP AND DEBUG CACHE INFO ===="
          echo "Creating required directories..."
          mkdir -p ~/.android/avd
          mkdir -p ~/.android/emulator
          
          echo "Checking ~/.android/avd:"
          ls -la ~/.android/ || echo "Android directory not found"
          ls -la ~/.android/avd/ || echo "AVD directory not found"
          echo "Size of ~/.android/avd:"
          du -sh ~/.android/avd/ 2>/dev/null || echo "Cannot get size"
          
          echo "Checking ~/.android/emulator:"
          ls -la ~/.android/emulator/ || echo "Emulator directory not found"
          
          echo "Checking $ANDROID_SDK_ROOT:"
          ls -la $ANDROID_SDK_ROOT/ || echo "Directory not found"
          echo "Size of $ANDROID_SDK_ROOT:"
          du -sh $ANDROID_SDK_ROOT/ 2>/dev/null || echo "Cannot get size"
          
          echo "Total cache size estimation:"
          du -sh ~/.android/avd/ ~/.android/emulator/ 2>/dev/null || echo "Cannot get total size"

      - name: 🗄️ Cache AVD and Emulator
        id: cache-android
        uses: actions/cache@v3
        with:
          path: |
            ~/.android/avd
            ~/.android/emulator
          key: ${{ runner.os }}-android-avd-${{ hashFiles('**/build.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-avd-

      - name: 📊 Cache Status
        run: |
          echo "Cache hit: ${{ steps.cache-android.outputs.cache-hit }}"
          echo "Cache key: ${{ steps.cache-android.outputs.cache-primary-key }}"
          echo "Matched key: ${{ steps.cache-android.outputs.cache-matched-key }}"

      - name: 📊 Debug cache result
        run: |
          echo "==== POST-CACHE DEBUG INFO ===="
          echo "Cache directories after operation:"
          echo "~/.android/avd:"
          ls -la ~/.android/avd/ || echo "Directory not found"
          echo "$ANDROID_SDK_ROOT:"
          ls -la $ANDROID_SDK_ROOT/ || echo "Directory not found"
      - name: 📱 Prepare Emulator
        run: |
          # Установка зависимостей для эмулятора
          sudo apt-get update
          sudo apt-get install -y libpulse0 libgl1 libc++1 libxcb1 libxcb-xkb1 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-render0 libxcb-shape0 libxcb-shm0 libxcb-sync1 \
            libxcb-util1 libxcb-xfixes0 libxcb-xinerama0
            
          export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools"
          
          echo "🔧 ==== УСТАНОВКА КОМПОНЕНТОВ ===="
          # Принятие лицензий и установка компонентов
          echo "🔧 Принятие лицензий..."
          yes | sdkmanager --licenses || { echo "❌ ОШИБКА: sdkmanager license error"; exit 1; }
          
          echo "🔧 Установка компонентов..."
          yes | sdkmanager --install "emulator" "system-images;android-34;default;x86_64" || { echo "❌ ОШИБКА: sdkmanager install error"; exit 1; }
          
          echo "🔧 Проверка установки..."
          sdkmanager --list | grep -E "emulator|system-images;android-34" || { echo "❌ ОШИБКА: Компоненты не установлены"; exit 1; }
          
          echo "🔧 ==== НАСТРОЙКА ПРАВ ===="
          echo "🔧 Установка прав на выполнение..."
          sudo chmod -R +x $ANDROID_SDK_ROOT/emulator/ || echo "⚠️ Не удалось установить права для emulator"
          
          echo "🔧 Проверка прав..."
          ls -la $ANDROID_SDK_ROOT/emulator/emulator || { echo "❌ emulator не найден"; exit 1; }
          $ANDROID_SDK_ROOT/emulator/emulator -version || { echo "❌ emulator version failed"; exit 1; }
          
          echo "🔧 ==== СОЗДАНИЕ AVD ===="
          echo "🔧 Проверка доступных system images..."
          sdkmanager --list | grep "system-images;android-34" || echo "❌ System images не найдены"
          
          echo "🔧 Проверка директории для AVD..."
          ls -la ~/.android/ || echo "❌ ~/.android/ не существует"
          mkdir -p ~/.android/avd
          
          echo "🔧 Создание AVD..."
          echo "no" | avdmanager create avd --name "ci_nexus5" --package "system-images;android-34;default;x86_64" --device "Nexus 5" --force || { echo "❌ ОШИБКА: Не удалось создать AVD"; exit 1; }
          
          echo "🔧 Проверка созданного AVD..."
          ls -la ~/.android/avd/ || echo "❌ AVD директория не найдена"
          
          echo "🔧 Список доступных AVD:"
          avdmanager list avd || { echo "❌ ОШИБКА: Не удалось получить список AVD"; exit 1; }
          
          echo "🔧 Проверка конфигурации AVD..."
          # Проверяем оба возможных расположения
          if [ -f ~/.config/.android/avd/ci_nexus5.avd/config.ini ]; then
            echo "✅ Найдена конфигурация в ~/.config/.android/avd/"
            cat ~/.config/.android/avd/ci_nexus5.avd/config.ini
          elif [ -f ~/.android/avd/ci_nexus5.avd/config.ini ]; then
            echo "✅ Найдена конфигурация в ~/.android/avd/"
            cat ~/.android/avd/ci_nexus5.avd/config.ini
          else
            echo "❌ Конфигурация AVD не найдена в обоих расположениях"
            echo "Проверка директорий:"
            ls -la ~/.config/.android/avd/ || echo "❌ ~/.config/.android/avd/ не существует"
            ls -la ~/.android/avd/ || echo "❌ ~/.android/avd/ не существует"
            exit 1
          fi

          echo "🔧 ==== ТЕСТОВЫЙ ЗАПУСК ЭМУЛЯТОРА ===="
          echo "🔧 Запуск эмулятора..."
          
          # Запускаем эмулятор
          $ANDROID_SDK_ROOT/emulator/emulator -avd "ci_nexus5" -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -cores 1 &
          EMULATOR_PID=$!
          
          # Ждем 30 секунд и проверяем, что процесс жив
          sleep 30
          if ! ps -p $EMULATOR_PID > /dev/null; then
            echo "❌ Эмулятор не запустился"
            exit 1
          fi
          
          # Проверяем, что эмулятор виден в adb
          if ! adb devices | grep -q "emulator"; then
            echo "❌ Эмулятор не появился в списке устройств"
            kill $EMULATOR_PID 2>/dev/null || true
            exit 1
          fi
          
          echo "✅ Эмулятор успешно запущен"
          
          # Останавливаем эмулятор
          kill $EMULATOR_PID 2>/dev/null || true

  # Параллельная генерация скриншотов для телефона
  screenshots-phone:
    needs: [build-and-test, prepare-emulator, setup-android-sdk]
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ needs.setup-android-sdk.outputs.sdk-path }}
      ANDROID_HOME: ${{ needs.setup-android-sdk.outputs.sdk-path }}
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    # SDK уже доступен из setup-android-sdk job

    - name: 🗄️ Cache AVD and Emulator
      uses: actions/cache@v3
      with:
        path: |
          ~/.android/avd
          ~/.android/emulator
        key: ${{ runner.os }}-android-avd-${{ hashFiles('**/build.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-android-avd-

    - name: 📦 Download APK artifact
      uses: actions/download-artifact@v4
      with:
        name: FinancialSuccess-v${{ needs.build-and-test.outputs.version }}-${{ needs.build-and-test.outputs.date }}-debug.apk
        path: releases/debug/
        
    - name: 📦 Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpulse0 libgl1 libc++1 libxcb1 libxcb-xkb1 \
          libxkbcommon0 libxkbcommon-x11-0 libxcb-icccm4 \
          libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
          libxcb-render0 libxcb-shape0 libxcb-shm0 libxcb-sync1 \
          libxcb-util1 libxcb-xfixes0 libxcb-xinerama0

    - name: 📦 Install required components
      run: |
        echo "📦 ==== УСТАНОВКА КОМПОНЕНТОВ ===="
        echo "📦 ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
        
        # Добавляем sdkmanager в PATH
        echo "📦 Настройка PATH..."
        export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
        echo "📦 PATH: $PATH"
        
        # Проверяем наличие sdkmanager
        echo "📦 Проверка sdkmanager..."
        which sdkmanager || { echo "❌ ОШИБКА: sdkmanager не найден в PATH"; exit 1; }
        
        # Установка необходимых компонентов через sdkmanager
        echo "📦 Установка компонентов..."
        yes | sdkmanager --install "platform-tools" "emulator" "system-images;android-34;default;x86_64" || { echo "❌ ОШИБКА: Не удалось установить компоненты"; exit 1; }
        
        echo "📦 Проверка установки..."
        sdkmanager --list | grep -E "platform-tools|emulator|system-images;android-34" || { echo "❌ ОШИБКА: Компоненты не установлены"; exit 1; }
        
        echo "📦 Принятие лицензий..."
        yes | sdkmanager --licenses || { echo "❌ ОШИБКА: Не удалось принять лицензии"; exit 1; }

    - name: 🔧 Проверка и настройка Android SDK
      run: |
        echo "🔍 ==== ПРОВЕРКА И НАСТРОЙКА ANDROID SDK ===="
        echo "🔍 ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
        
        # Проверка критических компонентов
        components=(
          "platform-tools/adb"
          "emulator/emulator"
          "cmdline-tools/latest/bin/avdmanager"
        )
        
        for component in "${components[@]}"; do
          echo "🔍 Проверка $component:"
          if [ -f "$ANDROID_SDK_ROOT/$component" ]; then
            echo "✅ $component найден"
            sudo chmod +x "$ANDROID_SDK_ROOT/$component" || { echo "❌ ОШИБКА: Не удалось установить права для $component"; exit 1; }
          else
            echo "❌ $component не найден"
            exit 1
          fi
        done
        
        # Установка прав на выполнение для директорий
        chmod +x $ANDROID_SDK_ROOT/emulator/qemu/linux-x86_64/* || echo "⚠️ Не удалось установить права для qemu"
        
        # Быстрая проверка работоспособности
        echo "🔧 Проверка работоспособности команд:"
        $ANDROID_SDK_ROOT/platform-tools/adb version || echo "❌ adb version failed"
        $ANDROID_SDK_ROOT/emulator/emulator -version || echo "❌ emulator version failed"
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager list avd || echo "❌ avdmanager failed"

    - name: 🔍 Проверка наличия adb в PATH (phone)
      run: |
        echo "🔍 Установка зависимостей для adb..."
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y libc6:i386 libstdc++6:i386 lib32z1 lib32stdc++6
        
        echo "🔍 Настройка PATH для adb..."
        export PATH="$PATH:$ANDROID_SDK_ROOT/platform-tools"
        echo "PATH: $PATH"
        
        echo "🔍 Проверка наличия adb..."
        echo "🔍 Проверяем существование файла adb..."
        ls -la $ANDROID_SDK_ROOT/platform-tools/adb || echo "❌ Файл adb не найден"
        
        echo "🔍 Проверяем права на выполнение..."
        file $ANDROID_SDK_ROOT/platform-tools/adb || echo "❌ Не удалось определить тип файла"
        
        echo "🔍 Попытка запуска adb по полному пути..."
        $ANDROID_SDK_ROOT/platform-tools/adb version || echo "❌ adb version failed"
        
        echo "🔍 Попытка запуска adb через which..."
        which adb || echo "❌ which adb failed"
        
        echo "🔍 Проверка библиотек adb..."
        ldd $ANDROID_SDK_ROOT/platform-tools/adb || echo "❌ ldd failed"

    - name: 🎭 Install Maestro
      run: |
        curl -L "https://get.maestro.mobile.dev" | bash
        export PATH="$PATH:$HOME/.maestro/bin"
        echo "n" | maestro --version

    - name: 📱 Start Android Emulator and Install APK (Phone)
      shell: bash
      run: |
        echo "📱 ==== ЗАПУСК ЭМУЛЯТОРА ТЕЛЕФОНА ===="
        export PATH="$PATH:$ANDROID_SDK_ROOT/emulator:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
        set -e
        
        echo "📱 Настройка переменных окружения..."
        echo "📱 SDK root: $ANDROID_SDK_ROOT"
        echo "📱 ANDROID_HOME: $ANDROID_HOME"
        echo "📱 PATH: $PATH"
        
        echo "📱 Проверка system-images..."
        if [ ! -d "$ANDROID_SDK_ROOT/system-images/android-34/default/x86_64/" ]; then
          echo "❌ system-images не найдены, устанавливаем..."
          export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          yes | sdkmanager --install "system-images;android-34;default;x86_64" || { echo "❌ ОШИБКА: Не удалось установить system-images"; exit 1; }
          yes | sdkmanager --licenses || { echo "❌ ОШИБКА: Не удалось принять лицензии"; exit 1; }
        fi
        ls -la $ANDROID_SDK_ROOT/system-images/android-34/default/x86_64/ || { echo "❌ system-images не найдены после установки"; exit 1; }
        
        echo "📱 Подготовка директорий для AVD..."
        # Создаем все необходимые директории
        mkdir -p ~/.android/avd
        mkdir -p ~/.config/.android/avd
        
        echo "📱 Очистка старых AVD..."
        rm -rf ~/.android/avd/* ~/.config/.android/avd/*
        
        echo "📱 Проверка директорий AVD:"
        echo "~/.android/avd/:"
        ls -la ~/.android/avd/ || echo "❌ ~/.android/avd/ не существует"
        echo "~/.config/.android/avd/:"
        ls -la ~/.config/.android/avd/ || echo "❌ ~/.config/.android/avd/ не существует"
        
        # Создаем символическую ссылку для совместимости
        ln -sf ~/.config/.android/avd ~/.android/avd || echo "⚠️ Не удалось создать символическую ссылку"

        echo "📱 ==== СОЗДАНИЕ AVD ===="
        echo "📱 Проверка существующих AVD..."
        avdmanager list avd || echo "❌ avdmanager list avd failed"
        
        echo "📱 Создание AVD ci_nexus5..."
        if ! avdmanager list avd | grep -q "ci_nexus5"; then
          echo "📱 AVD ci_nexus5 не существует, создаем..."
          echo "no" | avdmanager create avd --name "ci_nexus5" --package "system-images;android-34;default;x86_64" --device "Nexus 5" --force || { echo "❌ ОШИБКА: Не удалось создать AVD"; exit 1; }
          echo "✅ AVD ci_nexus5 создан"
        else
          echo "✅ AVD ci_nexus5 уже существует"
        fi
        
        echo "📱 Проверка созданного AVD..."
        avdmanager list avd | grep ci_nexus5 || echo "❌ AVD ci_nexus5 не найден в списке"

        echo "📱 ==== ЗАПУСК ЭМУЛЯТОРА ===="
        echo "📱 Запуск эмулятора в фоне..."
        emulator -avd "ci_nexus5" -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -accel off -no-snapshot -no-metrics -memory 1024 -cores 1 -skin 1080x1920 &
        EMULATOR_PID=$!
        echo "📱 PID эмулятора: $EMULATOR_PID"
        
        echo "📱 Проверка процесса эмулятора..."
        ps aux | grep emulator | grep -v grep || echo "❌ Процесс эмулятора не найден"

        echo "📱 Пауза после запуска эмулятора (45 секунд)..."
        sleep 45
        
        echo "📱 Проверка процесса эмулятора после паузы..."
        ps aux | grep emulator | grep -v grep || echo "❌ Процесс эмулятора не найден после паузы"

        echo "📱 ==== ОЖИДАНИЕ ПОЯВЛЕНИЯ В ADB ===="
        emulator_timeout=120
        emulator_elapsed=0
        
        # Перезапускаем ADB сервер для очистки состояния
        echo "📱 Перезапуск ADB сервера..."
        adb kill-server || echo "⚠️ adb kill-server failed"
        sleep 2
        adb start-server || echo "⚠️ adb start-server failed"
        sleep 3
        
        for i in {1..60}; do
          echo "📱 Попытка $i/60: проверка adb devices..."
          
          # Проверяем доступность ADB
          if ! adb devices >/dev/null 2>&1; then
            echo "❌ adb devices failed, перезапускаем ADB..."
            adb kill-server || true
            sleep 2
            adb start-server || true
            sleep 3
            continue
          fi
          
          devices_output=$(adb devices 2>/dev/null || echo "")
          if echo "$devices_output" | grep -q "emulator"; then
            echo "✅ Эмулятор появился в adb"
            echo "📱 Полный список устройств:"
            adb devices
            break
          fi
          
          if [ $i -eq 60 ]; then
            echo "❌ Не удалось запустить эмулятор за $emulator_timeout секунд"
            echo "📱 Проверка ADB состояния:"
            adb devices || echo "adb devices failed"
            echo "📱 Логи эмулятора:"
            ps aux | grep emulator | grep -v grep || echo "❌ Процесс эмулятора не найден"
            kill $EMULATOR_PID 2>/dev/null || true
            exit 1
          fi
          
          sleep 2
          emulator_elapsed=$((emulator_elapsed + 2))
          if [ $((emulator_elapsed % 30)) -eq 0 ]; then
            echo "⏳ Ожидание эмулятора: $emulator_elapsed секунд из $emulator_timeout..."
            echo "📱 Проверка процесса эмулятора:"
            ps aux | grep emulator | grep -v grep || echo "❌ Процесс эмулятора не найден"
          fi
        done

        echo "📱 ==== ОЖИДАНИЕ ЗАГРУЗКИ ANDROID ===="
        boot_timeout=180
        boot_elapsed=0
        for i in {1..45}; do
          echo "📱 Попытка $i/45: проверка загрузки..."
          
          # Проверяем доступность ADB
          if ! adb devices | grep -q "emulator"; then
            sleep 4
            continue
          fi
          
          # Проверяем, отвечает ли Android на команды
          if adb shell "echo 'test'" 2>/dev/null | grep -q "test"; then
            echo "✅ Android отвечает на команды"
            break
          fi
          
          # Проверяем sys.boot_completed
          boot_completed=$(adb shell getprop sys.boot_completed 2>/dev/null || echo "")
          if [ "$boot_completed" = "1" ]; then
            echo "✅ Android полностью загружен"
            break
          fi
          
          if [ $i -eq 45 ]; then
            echo "❌ Android не загрузился за $boot_timeout секунд"
            kill $EMULATOR_PID 2>/dev/null || true
            exit 1
          fi
          
          sleep 4
          boot_elapsed=$((boot_elapsed + 4))
          if [ $((boot_elapsed % 60)) -eq 0 ]; then
            echo "⏳ Ожидание загрузки Android: $boot_elapsed секунд из $boot_timeout..."
          fi
        done

        echo "📱 ==== РАЗБЛОКИРОВКА ЭКРАНА ===="
        echo "📱 Разблокировка экрана..."
        adb shell input keyevent 82 || echo "❌ keyevent 82 failed"
        sleep 2

        echo "📱 ==== УСТАНОВКА APK ===="
        echo "📱 Установка APK..."
        adb install "releases/debug/FinancialSuccess-v${{ needs.setup-android-sdk.outputs.version }}-${{ needs.setup-android-sdk.outputs.date }}-debug.apk" || { echo "❌ ОШИБКА: adb install failed"; kill $EMULATOR_PID 2>/dev/null || true; exit 1; }
        
        echo "📱 Проверка установки..."
        if adb shell pm list packages | grep -q financialsuccess; then
          echo "✅ APK успешно установлен"
        else
          echo "❌ APK installation failed"
          kill $EMULATOR_PID 2>/dev/null || true
          exit 1
        fi

    - name: 📋 Log workspace structure after screenshots
      run: |
        echo "==== WORKSPACE STRUCTURE AFTER SCREENSHOTS ===="
        ls -la
        echo "==== FIND ALL APK FILES ===="
        find . -name "*.apk" -type f
        echo "==== ANDROID DEVICES ===="
        adb devices || echo "adb not available"

    - name: 📸 Run Maestro Screenshots (Phone)
      run: |
        export PATH="$PATH:$HOME/.maestro/bin"
        mkdir -p screenshots/phone
        # Пробуем специфичную конфигурацию для телефона
        config_file="maestro/screenshots-stable.yaml"
        if [ ! -f "$config_file" ]; then
          config_file="maestro/screenshots.yaml"
        fi
        if [ -f "$config_file" ]; then
          echo "Using phone screenshots configuration: $config_file"
          maestro test "$config_file" --format junit --output screenshots/phone/
          echo "📱 Phone screenshots completed!"
        else
          echo "⚠️ Warning: Maestro configuration file not found: $config_file"
          echo "📱 Phone screenshots skipped!"
        fi
    - name: 📱 Stop Android Emulator (Phone)
      run: |
        echo "📱 Остановка эмулятора..."
        kill $EMULATOR_PID 2>/dev/null || true
        pkill -f emulator 2>/dev/null || true
        echo "📱 Проверка остановки эмулятора..."
        sleep 5
        ps aux | grep emulator | grep -v grep || echo "✅ Эмулятор остановлен"

    - name: 📤 Upload Phone Screenshots
      uses: actions/upload-artifact@v4
      with:
        name: phone-screenshots-v${{ needs.build-and-test.outputs.version }}
        path: screenshots/phone/
        retention-days: 30

  # Финальная сборка релиза
  create-release:
    runs-on: ubuntu-latest
    needs: [setup-android-sdk, build-and-test, screenshots-phone]
    permissions:
      contents: write

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📥 Download APK
      uses: actions/download-artifact@v4
      with:
        name: FinancialSuccess-v${{ needs.build-and-test.outputs.version }}-${{ needs.build-and-test.outputs.date }}-debug.apk

    - name: 📥 Download Phone Screenshots
      uses: actions/download-artifact@v4
      with:
        name: phone-screenshots-v${{ needs.build-and-test.outputs.version }}

    - name: 📸 Prepare screenshots for repository
      run: |
        mkdir -p screenshots/phone
        
        # Проверяем наличие новых скриншотов
        if [ -d "screenshots/phone" ] && [ "$(ls -A screenshots/phone/)" ]; then
          echo "📱 Найдены новые скриншоты, подготавливаем для репозитория..."
          
          # Копируем только если есть новые файлы
          cp -r screenshots/phone/* screenshots/phone/ 2>/dev/null || true
          
          echo "📱 Phone screenshots:"
          ls -la screenshots/phone/
        else
          echo "📱 Новых скриншотов нет, пропускаем..."
        fi
        echo ""

    - name: 📝 Commit Screenshots to Repository
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add screenshots/
        if git diff --staged --quiet; then
          echo "No screenshots to commit"
        else
          git commit -m "📸 Auto-generated screenshots v${{ needs.build-and-test.outputs.version }} - ${{ needs.build-and-test.outputs.date }}
          
          📱 Screenshots:
          - Phone: $(ls screenshots/phone/*.png 2>/dev/null | wc -l) files
          - Total: $(find screenshots/ -name "*.png" 2>/dev/null | wc -l) files"
          git push
        fi

    - name: 🏷️ Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ needs.build-and-test.outputs.version }}-${{ needs.build-and-test.outputs.date }}
        name: "🎮 Financial Success v${{ needs.build-and-test.outputs.version }}"
        body_path: RELEASE_NOTES.md
        files: |
          releases/debug/*.apk
          screenshots/phone/*.png
        draft: false
        prerelease: false
        generate_release_notes: false

    - name: 📊 Build Summary
      run: |
        echo "🎉 Release completed successfully!"
        echo ""
        echo "📊 Results:"
        echo "🏷️ Version: ${{ needs.build-and-test.outputs.version }}"
        echo "🔢 Version Code: ${{ needs.build-and-test.outputs.version_code }}"
        echo "📅 Date: ${{ needs.build-and-test.outputs.date }}"
        echo "📱 APK: releases/debug/FinancialSuccess-v${{ needs.build-and-test.outputs.version }}-${{ needs.build-and-test.outputs.date }}-debug.apk"
        echo "📸 Phone screenshots: screenshots/phone/"
        echo ""
        echo "📁 Files:"
        ls -la releases/debug/ || echo "No APK files found"
        echo ""
        echo "📸 Phone screenshots:"
        ls -la screenshots/phone/ 2>/dev/null || echo "No phone screenshots"
