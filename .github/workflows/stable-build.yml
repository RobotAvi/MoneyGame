name: 🚀 Stable Build & Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'releases/debug/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.configureondemand=true
    -Dorg.gradle.caching=true
    -Dorg.gradle.workers.max=4
    -Dorg.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"

jobs:
  setup-android-sdk:
    runs-on: ubuntu-latest
    outputs:
      sdk-path: /usr/local/lib/android/sdk
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      date: ${{ steps.date.outputs.date }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 📅 Get current date
        id: date
        run: echo "date=$(date '+%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
      
      - name: 🔖 Get version info
        id: version
        run: |
          echo "🔍 ==== ПОЛУЧЕНИЕ ВЕРСИИ ===="
          echo "🔍 Проверяем существование app/build.gradle..."
          ls -la app/build.gradle || echo "❌ app/build.gradle не найден"
          
          echo "🔍 Содержимое app/build.gradle:"
          cat app/build.gradle | grep -E "(versionName|versionCode)" || echo "❌ Не найдены versionName или versionCode"
          
          # Извлекаем первую строку с versionName и берём строку в кавычках
          VERSION=$(grep -oP 'versionName.*' app/build.gradle | head -1 | grep -oP '"\K[^\"]+(?=")')
          # Извлекаем первую строку с versionCode и берём последнее целое число в строке
          VERSION_CODE=$(grep -oP 'versionCode.*' app/build.gradle | head -1 | grep -oP '[0-9]+' | tail -1)
          
          echo "🔍 Извлеченная версия: $VERSION"
          echo "🔍 Извлеченный код версии: $VERSION_CODE"
          
          if [ -z "$VERSION" ]; then
            echo "❌ ОШИБКА: Не удалось извлечь versionName"
            exit 1
          fi
          if [ -z "$VERSION_CODE" ]; then
            echo "❌ ОШИБКА: Не удалось извлечь versionCode"
            exit 1
          fi
          
          # Подготовим переменные для сборки: инкрементируем минорную и код
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          if [ -z "$MINOR" ]; then MINOR=0; fi
          echo "CI_VERSION_NAME=$MAJOR.$((MINOR+1))" >> $GITHUB_ENV
          echo "CI_VERSION_CODE=$((VERSION_CODE+1))" >> $GITHUB_ENV
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "✅ Версия успешно извлечена: $VERSION ($VERSION_CODE)"

      - name: 🗄️ Cache Android SDK
        id: cache-sdk-setup
        uses: actions/cache@v3
        with:
          path: |
            ~/.android/cache
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/avd
            ${{ env.ANDROID_SDK_ROOT }}
          key: ${{ runner.os }}-android-sdk-emulator-${{ hashFiles('**/build.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-emulator-
            ${{ runner.os }}-android-sdk-

      - name: 🛠️ Setup Android SDK (Cached)
        if: steps.cache-sdk-setup.outputs.cache-hit != 'true'
        run: |
          echo "🔧 ==== УСТАНОВКА ANDROID SDK (если не в кэше) ===="
          set -x
          
          # Проверяем, установлен ли уже SDK
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ] && [ -f "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "✅ Android SDK уже установлен, пропускаем установку"
            echo "🔧 Настройка переменных окружения..."
            export PATH="$PATH:$ANDROID_SDK_ROOT/emulator:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          else
            echo "🔧 Android SDK не найден, начинаем установку..."
            
            echo "🔧 Очистка существующих файлов..."
            rm -rf $HOME/cmdline-tools.zip $HOME/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
            
            echo "🔧 Обновление пакетов..."
            sudo apt-get update
            
            echo "🔧 Установка wget и unzip..."
            sudo apt-get install -y wget unzip
            
            echo "🔧 Загрузка commandline tools..."
            wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
            
            echo "🔧 Распаковка commandline tools..."
            unzip cmdline-tools.zip -d $HOME
            
            echo "🔧 Создание структуры директорий..."
            mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
            
            # Удаляем существующую директорию, если она есть
            if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
              echo "🔧 Удаление существующей директории latest..."
              rm -rf $ANDROID_SDK_ROOT/cmdline-tools/latest
            fi
            
            mv $HOME/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
            
            echo "🔧 Настройка переменных окружения..."
            export PATH="$PATH:$ANDROID_SDK_ROOT/emulator:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
            
            echo "🔧 Принятие лицензий..."
            yes | sdkmanager --licenses || { echo "❌ ОШИБКА: sdkmanager license error"; exit 1; }
            
            echo "🔧 Установка компонентов SDK..."
            yes | sdkmanager --install "platform-tools" "emulator" "system-images;android-34;google_apis;x86_64" || { echo "❌ ОШИБКА: sdkmanager install error"; exit 1; }
            echo "🔧 Проверка установки компонентов..."
            sdkmanager --list | grep -E "platform-tools|emulator|system-images;android-34" || { echo "❌ ОШИБКА: Компоненты не установлены"; exit 1; }
            
            echo "🔧 Установка прав на выполнение..."
            sudo chmod -R +x $ANDROID_SDK_ROOT/platform-tools/ || echo "⚠️ Не удалось установить права для platform-tools"
            sudo chmod -R +x $ANDROID_SDK_ROOT/emulator/ || echo "⚠️ Не удалось установить права для emulator"
            sudo chmod -R +x $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/ || echo "⚠️ Не удалось установить права для cmdline-tools"
            
            echo "🔧 Проверка прав на выполнение..."
            ls -la $ANDROID_SDK_ROOT/platform-tools/adb || echo "❌ adb не найден"
            ls -la $ANDROID_SDK_ROOT/emulator/emulator || echo "❌ emulator не найден"
            ls -la $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager || echo "❌ sdkmanager не найден"
            
            echo "✅ Android SDK установлен и готов к использованию"
          fi

      - name: 🛠️ Установка эмулятора (с кэшированием)
        if: steps.cache-sdk-setup.outputs.cache-hit != 'true'
        run: |
          echo "🔧 ==== УСТАНОВКА ЭМУЛЯТОРА (С КЭШИРОВАНИЕМ) ===="
          export PATH="$PATH:$ANDROID_SDK_ROOT/emulator:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          
          echo "🔧 Проверка кэша эмулятора..."
          if [ -f "$ANDROID_SDK_ROOT/emulator/emulator" ] && [ -d "~/.android/avd" ] && [ "$(ls -A ~/.android/avd/)" ]; then
            echo "✅ Найден кэшированный эмулятор и AVD, пропускаем установку"
            echo "🔧 Проверка кэшированного эмулятора..."
            ls -la $ANDROID_SDK_ROOT/emulator/emulator
            avdmanager list avd || echo "⚠️ AVD не найдены"
          else
            echo "🔧 Кэш эмулятора не найден, устанавливаем..."
            
            echo "🔧 Проверка наличия эмулятора..."
          if [ ! -f "$ANDROID_SDK_ROOT/emulator/emulator" ]; then
            echo "🔧 Эмулятор не найден, устанавливаем..."
            yes | sdkmanager --install "emulator" || { echo "❌ ОШИБКА: Установка эмулятора не удалась"; exit 1; }
          fi
          
          echo "🔧 Проверка наличия system-image..."
          if ! sdkmanager --list | grep -q "system-images;android-34"; then
            echo "🔧 System image не найден, устанавливаем..."
            yes | sdkmanager --install "system-images;android-34;google_apis;x86_64" || { echo "❌ ОШИБКА: Установка system-image не удалась"; exit 1; }
          fi
          
          echo "🔧 Создание AVD для кэширования..."
          # Создаем директорию AVD если её нет
          mkdir -p ~/.android/avd
          
          echo "🔧 Проверка доступных system-images..."
          sdkmanager --list | grep "system-images;android-34;google_apis;x86_64" || echo "❌ system-images;android-34;google_apis;x86_64 не найден"
          
          echo "🔧 Создание AVD..."
          echo "no" | avdmanager create avd -n "cached-emulator" -k "system-images;android-34;google_apis;x86_64" || echo "⚠️ Не удалось создать AVD с google_apis"
          
          echo "🔧 Проверка созданного AVD..."
          ls -la ~/.android/avd/ || echo "❌ AVD директория не создана"
          
          # Если AVD не создался, пробуем с default system-image
          if [ ! -f "~/.android/avd/cached-emulator.avd/config.ini" ]; then
            echo "🔧 Попытка создания AVD с default system-image..."
            echo "no" | avdmanager create avd -n "cached-emulator" -k "system-images;android-34;default;x86_64" || echo "⚠️ Не удалось создать AVD с default"
          fi
          
          echo "🔧 Проверка установки..."
          ls -la $ANDROID_SDK_ROOT/emulator/emulator || echo "❌ emulator не найден"
          sdkmanager --list | grep -E "emulator|system-images;android-34" || echo "⚠️ Компоненты эмулятора не найдены в списке"
          avdmanager list avd || echo "⚠️ AVD не найдены"
          
                      echo "✅ Эмулятор установлен и готов к кэшированию"
          fi

      - name: 🔍 Отладка кэша
        run: |
          echo "🔍 ==== ОТЛАДКА КЭША ===="
          echo "🔍 Проверяем что будет кэшироваться..."
          echo "🔍 ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo "🔍 Содержимое ANDROID_SDK_ROOT:"
          ls -la $ANDROID_SDK_ROOT/ || echo "❌ ANDROID_SDK_ROOT не существует"
          echo "🔍 Содержимое ~/.android/avd:"
          ls -la ~/.android/avd/ || echo "❌ ~/.android/avd не существует"
          echo "🔍 Проверка эмулятора:"
          ls -la $ANDROID_SDK_ROOT/emulator/emulator || echo "❌ emulator не найден"
          echo "🔍 Проверка adb:"
          ls -la $ANDROID_SDK_ROOT/platform-tools/adb || echo "❌ adb не найден"




  # Сборка и тестирование APK
  build-and-test:
    runs-on: ubuntu-latest
    needs: setup-android-sdk
    env:
      ANDROID_SDK_ROOT: ${{ needs.setup-android-sdk.outputs.sdk-path }}
      ANDROID_HOME: ${{ needs.setup-android-sdk.outputs.sdk-path }}
    outputs:
      version: ${{ needs.setup-android-sdk.outputs.version }}
      version_code: ${{ needs.setup-android-sdk.outputs.version_code }}
      date: ${{ needs.setup-android-sdk.outputs.date }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: Remove default GitHub Actions credentials
        run: git config --local --remove-section http."https://github.com/" || true
        
      - name: 🗄️ Cache Gradle dependencies
        id: cache-gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔧 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          

          
      - name: 🔧 Проверка SDK для сборки
        run: |
          echo "🔧 ==== ПРОВЕРКА SDK ДЛЯ СБОРКИ ===="
          echo "🔧 ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo "🔧 Проверяем существование SDK:"
          ls -la $ANDROID_SDK_ROOT/ || echo "❌ SDK не найден"
          
          echo "🔧 Проверка наличия platform-tools..."
          ls -la $ANDROID_SDK_ROOT/platform-tools/adb || echo "❌ adb не найден"
          
          echo "🔧 Тест adb:"
          $ANDROID_SDK_ROOT/platform-tools/adb version || echo "❌ adb version failed"
      
      - name: 🔖 Compute CI version for build
        run: |
          CURR_VERSION=$(grep -oP 'versionName.*' app/build.gradle | head -1 | grep -oP '"\K[^\"]+(?=")' || true)
          CURR_CODE=$(grep -oP 'versionCode.*' app/build.gradle | head -1 | grep -oP '[0-9]+' | tail -1 || true)
          if [ -z "$CURR_VERSION" ]; then CURR_VERSION="1.135"; fi
          if [ -z "$CURR_CODE" ]; then CURR_CODE=136; fi
          MAJOR=$(echo $CURR_VERSION | cut -d. -f1)
          MINOR=$(echo $CURR_VERSION | cut -d. -f2)
          if [ -z "$MINOR" ]; then MINOR=0; fi
          echo "CI_VERSION_NAME=$MAJOR.$((MINOR+1))" >> $GITHUB_ENV
          echo "CI_VERSION_CODE=$((CURR_CODE+1))" >> $GITHUB_ENV
      
      - name: 🏗️ Build APK
        run: |
          echo "🏗️ ==== СБОРКА APK ===="
          echo "🏗️ Настройка переменных окружения..."
          # Используем переменные, переданные из setup-android-sdk
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          
          echo "🏗️ ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo "🏗️ ANDROID_HOME: $ANDROID_HOME"
          echo "🏗️ PATH: $PATH"
          echo "🏷️ CI_VERSION_NAME: ${CI_VERSION_NAME:-not-set}"
          echo "🔢 CI_VERSION_CODE: ${CI_VERSION_CODE:-not-set}"
          
          echo "🏗️ Проверка Gradle wrapper..."
          ls -la ./gradlew || echo "❌ gradlew не найден"
          chmod +x ./gradlew || echo "⚠️ Не удалось установить права на gradlew"
          
          echo "🏗️ Проверка app/build.gradle..."
          ls -la app/build.gradle || echo "❌ app/build.gradle не найден"
          cat app/build.gradle | grep -E "(versionName|versionCode|applicationId)" || echo "❌ Не найдены ключевые параметры"
          
          echo "🏗️ Очистка проекта..."
          ./gradlew clean || { echo "❌ ОШИБКА: gradlew clean failed"; exit 1; }
          
          echo "🏗️ Сборка debug APK..."
          ./gradlew assembleDebug || { echo "❌ ОШИБКА: gradlew assembleDebug failed"; exit 1; }
          
          echo "🏗️ ==== ПРОВЕРКА СОБРАННОГО APK ===="
          echo "🏗️ Поиск APK файлов..."
          find . -name "*.apk" -type f || echo "❌ APK файлы не найдены"
          
          echo "🏗️ Проверка app/build/outputs/apk/debug/..."
          ls -la app/build/outputs/apk/debug/ || echo "❌ debug APK директория не найдена"
          
          echo "🏗️ Создание директории releases/debug..."
          mkdir -p releases/debug
          
          echo "🏗️ Копирование APK..."
          cp app/build/outputs/apk/debug/app-debug.apk releases/debug/latest-debug.apk || { echo "❌ ОШИБКА: Не удалось скопировать APK"; exit 1; }
          
          echo "🏗️ Проверка скопированного APK..."
          ls -la releases/debug/latest-debug.apk || echo "❌ APK не найден в releases/debug/"
          
          echo "🏗️ Размер APK:"
          du -h releases/debug/latest-debug.apk || echo "❌ Не удалось получить размер APK"
          
          echo "🏗️ Проверка APK через aapt..."
          $ANDROID_SDK_ROOT/build-tools/*/aapt dump badging releases/debug/latest-debug.apk | head -10 || echo "❌ aapt failed"
          
      - name: 🧹 Очистка старых версий APK (оставляем только 3 последние)
        run: |
          echo "🧹 ==== ОЧИСТКА СТАРЫХ ВЕРСИЙ APK ===="
          echo "🧹 Проверяем количество APK файлов в releases/debug/"
          
          # Подсчитываем количество APK файлов
          APK_COUNT=$(find releases/debug/ -name "FinancialSuccess-v*.apk" | wc -l)
          echo "🧹 Найдено APK файлов: $APK_COUNT"
          
          if [ $APK_COUNT -gt 3 ]; then
            echo "🧹 Удаляем старые версии (оставляем только 3 последние)..."
            
            # Получаем список всех APK файлов, сортированных по времени модификации (новые первыми)
            # И удаляем все, кроме первых 3
            find releases/debug/ -name "FinancialSuccess-v*.apk" -printf '%T@ %p\n' | \
            sort -nr | \
            tail -n +4 | \
            cut -d' ' -f2- | \
            while read file; do
              echo "🧹 Удаляем: $file"
              rm -f "$file"
            done
            
            echo "🧹 Очистка завершена"
          else
            echo "🧹 Количество APK файлов в пределах нормы (≤3), очистка не требуется"
          fi
          
          echo "🧹 Текущие APK файлы:"
          ls -la releases/debug/FinancialSuccess-v*.apk 2>/dev/null || echo "Нет APK файлов"

      - name: 🏗️ Копировать apk с красивым именем
        run: |
          VERSION="${{ needs.setup-android-sdk.outputs.version }}"
          DATE="${{ needs.setup-android-sdk.outputs.date }}"
          cp app/build/outputs/apk/debug/app-debug.apk "releases/debug/FinancialSuccess-v${VERSION}-${DATE}-debug.apk"
          
          echo "🏗️ APK скопирован: FinancialSuccess-v${VERSION}-${DATE}-debug.apk"
          
          # Проверяем количество файлов после копирования
          APK_COUNT=$(find releases/debug/ -name "FinancialSuccess-v*.apk" | wc -l)
          echo "🏗️ Всего APK файлов после копирования: $APK_COUNT"

      - name: 📦 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinancialSuccess-v${{ needs.setup-android-sdk.outputs.version }}-${{ needs.setup-android-sdk.outputs.date }}-debug.apk
          path: releases/debug/FinancialSuccess-v${{ needs.setup-android-sdk.outputs.version }}-${{ needs.setup-android-sdk.outputs.date }}-debug.apk

      - name: Bump version in build.gradle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          CURR_VERSION=$(grep -oP 'versionName\s+\(ciVersionName \?: \"\K[^\"]+' app/build.gradle || true)
          if [ -z "$CURR_VERSION" ]; then
            CURR_VERSION=$(grep -oP 'versionName\s+\"\K[^\"]+' app/build.gradle)
          fi
          CURR_CODE=$(grep -oP 'versionCode\s+\(ciVersionCode.*: \K[0-9]+' app/build.gradle || true)
          if [ -z "$CURR_CODE" ]; then
            CURR_CODE=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle)
          fi
          NEW_CODE=$((CURR_CODE+1))
          MAJOR=$(echo $CURR_VERSION | cut -d. -f1)
          MINOR=$(echo $CURR_VERSION | cut -d. -f2)
          if [ -z "$MINOR" ]; then MINOR=0; fi
          NEW_MINOR=$((MINOR+1))
          NEW_VERSION="$MAJOR.$NEW_MINOR"
          # Обновляем только значения по умолчанию, сохраняя логику с CI переменными
          sed -i "s/versionCode (ciVersionCode .*: [0-9]*)/versionCode (ciVersionCode != null && ciVersionCode.isInteger() ? ciVersionCode.toInteger() : ${NEW_CODE})/" app/build.gradle
          sed -i "s/versionName (ciVersionName ?: \"[^\"]*\")/versionName (ciVersionName ?: \"${NEW_VERSION}\")/" app/build.gradle
          echo "Bumped version defaults to $NEW_VERSION ($NEW_CODE)"

      - name: Commit APK and version bump to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          
          # Финальная проверка и очистка перед коммитом
          echo "🔍 ==== ФИНАЛЬНАЯ ПРОВЕРКА ПЕРЕД КОММИТОМ ===="
          echo "🔍 Количество APK файлов перед коммитом:"
          find releases/debug/ -name "FinancialSuccess-v*.apk" | wc -l
          
          # Удаляем старые APK из git, если их больше 3
          APK_FILES=$(find releases/debug/ -name "FinancialSuccess-v*.apk" -printf '%T@ %p\n' | sort -nr | tail -n +4 | cut -d' ' -f2-)
          if [ ! -z "$APK_FILES" ]; then
            echo "🔍 Удаляем старые APK из git:"
            echo "$APK_FILES" | while read file; do
              echo "🔍 Удаляем из git: $file"
              git rm -f "$file" 2>/dev/null || echo "Файл $file уже удален"
            done
          fi
          
          git add releases/debug/*.apk app/build.gradle
          git commit -m "Update APK and bump version [skip ci]" || echo "Nothing to commit"
          git push https://x-access-token:${GH_PAT}@github.com/RobotAvi/MoneyGame.git HEAD:main
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

  prepare-emulator:
    name: 🧪 Запуск Android-эмулятора
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: setup-android-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ANDROID_SDK_ROOT: ${{ needs.setup-android-sdk.outputs.sdk-path }}
      ANDROID_HOME: ${{ needs.setup-android-sdk.outputs.sdk-path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🗄️ Cache Android SDK and Emulator
        id: cache-sdk-emulator
        uses: actions/cache@v3
        with:
          path: |
            ~/.android/cache
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/avd
            ${{ env.ANDROID_SDK_ROOT }}
          key: ${{ runner.os }}-android-sdk-emulator-${{ hashFiles('**/build.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-emulator-
            ${{ runner.os }}-android-sdk-



      - name: 🔍 Отладка восстановленного кэша
        run: |
          echo "🔍 ==== ОТЛАДКА ВОССТАНОВЛЕННОГО КЭША ===="
          echo "🔍 ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo "🔍 Содержимое ANDROID_SDK_ROOT:"
          ls -la $ANDROID_SDK_ROOT/ || echo "❌ ANDROID_SDK_ROOT не существует"
          echo "🔍 Содержимое ~/.android/avd:"
          ls -la ~/.android/avd/ || echo "❌ ~/.android/avd не существует"
          echo "🔍 Проверка эмулятора:"
          ls -la $ANDROID_SDK_ROOT/emulator/emulator || echo "❌ emulator не найден"
          echo "🔍 Проверка adb:"
          ls -la $ANDROID_SDK_ROOT/platform-tools/adb || echo "❌ adb не найден"

      - name: Настройка PATH для SDK
        run: |
          echo "🔧 ==== НАСТРОЙКА PATH ДЛЯ SDK ===="
          export PATH="$PATH:$ANDROID_SDK_ROOT/emulator:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          echo "PATH: $PATH"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          
          # Проверяем доступность adb
          echo "🔧 Проверка adb:"
          adb version || { echo "❌ adb не найден - SDK не установлен в setup-android-sdk job"; exit 1; }
          
          # Проверяем доступность emulator
          echo "🔧 Проверка emulator:"
          if [ ! -f "$ANDROID_SDK_ROOT/emulator/emulator" ]; then
            echo "🔧 Эмулятор не найден, устанавливаем..."
            yes | sdkmanager --install "emulator" || { echo "❌ ОШИБКА: Установка эмулятора не удалась"; exit 1; }
          fi
          
                     # Устанавливаем системные зависимости для эмулятора
           echo "🔧 Установка системных зависимостей для эмулятора..."
           sudo apt-get update
           sudo apt-get install -y libpulse0 libc6 libstdc++6 libx11-6 libxext6 libxrender1 libxtst6 libxi6 libgl1 libfontconfig1 libdbus-1-3 libqt5widgets5 libqt5gui5 libqt5core5a libnss3 libxcomposite1 libxcursor1 libxdamage1 libxrandr2 libasound2t64 libxss1 libxkbcommon0 libxshmfence1 libwayland-client0 libwayland-cursor0 libwayland-egl1 mesa-utils
          
          # Проверяем наличие system-image
          echo "🔧 Проверка system-image:"
          if ! sdkmanager --list | grep -q "system-images;android-34;google_apis;x86_64"; then
            echo "🔧 System image не найден, устанавливаем..."
            yes | sdkmanager --install "system-images;android-34;google_apis;x86_64" || { echo "❌ ОШИБКА: Установка system-image не удалась"; exit 1; }
          fi
          
          emulator -version || { echo "❌ emulator не найден - SDK не установлен в setup-android-sdk job"; exit 1; }



      - name: Проверка кэша эмулятора
        run: |
          echo "🔧 ==== ПРОВЕРКА КЭША ЭМУЛЯТОРА ===="
          echo "🔧 Проверка содержимого emulator:"
          ls -l $ANDROID_SDK_ROOT/emulator
          echo "🔧 Проверка содержимого SDK:"
          ls -l $ANDROID_SDK_ROOT
          echo "🔧 Проверка кэшированных AVD:"
          ls -la ~/.android/avd/ 2>/dev/null || echo "❌ AVD директория не найдена"
          echo "🔧 Список доступных AVD:"
          avdmanager list avd || echo "❌ AVD не найдены"

      - name: Запуск Android-эмулятора (с кэшированием)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel
          ram-size: 1024
          heap-size: 256
          disable-animations: true
          avd-name: cached-emulator
          emulator-options: "-no-window -no-audio -no-boot-anim -no-accel -no-snapshot -no-snapshot-save -no-snapshot-load -memory 1024 -cores 1 -no-metrics"
          script: |
            echo "🧪 Эмулятор запущен (кэшированный)"
            adb devices
            echo "🧪 Быстрая проверка состояния..."
            timeout 60 adb wait-for-device
            echo "🧪 Проверка загрузки..."
            timeout 30 adb shell getprop sys.boot_completed || echo "⚠️ Эмулятор еще загружается"

      - name: Проверка подключения
        run: |
          echo "📱 ==== ПРОВЕРКА ПОДКЛЮЧЕНИЯ ===="
          # Используем adb из нашего SDK
          $ANDROID_SDK_ROOT/platform-tools/adb devices
  # Параллельная генерация скриншотов для телефона
  screenshots-phone:
    needs: [build-and-test, prepare-emulator, setup-android-sdk]
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ needs.setup-android-sdk.outputs.sdk-path }}
      ANDROID_HOME: ${{ needs.setup-android-sdk.outputs.sdk-path }}
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🗄️ Cache Android SDK and Emulator
      id: cache-sdk-screenshots
      uses: actions/cache@v3
      with:
        path: |
          ~/.android/cache
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.android/avd
          ${{ env.ANDROID_SDK_ROOT }}
        key: ${{ runner.os }}-android-sdk-emulator-${{ hashFiles('**/build.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-android-sdk-emulator-
          ${{ runner.os }}-android-sdk-





    - name: 📦 Download APK artifact
      uses: actions/download-artifact@v4
      with:
        name: FinancialSuccess-v${{ needs.build-and-test.outputs.version }}-${{ needs.build-and-test.outputs.date }}-debug.apk
        path: releases/debug/

    - name: 🎭 Install Maestro
      run: |
        curl -L "https://get.maestro.mobile.dev" | bash
        export PATH="$PATH:$HOME/.maestro/bin"
        echo "n" | maestro --version

    - name: 📱 Install APK on Emulator
      run: |
        echo "📱 ==== УСТАНОВКА APK НА ЭМУЛЯТОР ===="
        # Настраиваем PATH для adb
        export PATH="$PATH:$ANDROID_SDK_ROOT/emulator:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
        echo "PATH: $PATH"
        echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
        
        # Проверяем доступность adb
        echo "📱 Проверка adb:"
        adb version || { echo "❌ adb не найден - SDK не установлен в setup-android-sdk job"; exit 1; }
        
        # Устанавливаем APK
        adb install "releases/debug/FinancialSuccess-v${{ needs.build-and-test.outputs.version }}-${{ needs.build-and-test.outputs.date }}-debug.apk"
        
        echo "📱 Проверка установки..."
        if adb shell pm list packages | grep -q financialsuccess; then
          echo "✅ APK успешно установлен"
        else
          echo "❌ APK installation failed"
          exit 1
        fi

    - name: 📸 Run Maestro Screenshots (Phone)
      run: |
        export PATH="$PATH:$HOME/.maestro/bin"
        mkdir -p screenshots/phone
        # Пробуем специфичную конфигурацию для телефона
        config_file="maestro/screenshots-stable.yaml"
        if [ ! -f "$config_file" ]; then
          config_file="maestro/screenshots.yaml"
        fi
        if [ -f "$config_file" ]; then
          echo "Using phone screenshots configuration: $config_file"
          maestro test "$config_file" --format junit --output screenshots/phone/
          echo "📱 Phone screenshots completed!"
        else
          echo "⚠️ Warning: Maestro configuration file not found: $config_file"
          echo "📱 Phone screenshots skipped!"
        fi

    - name: 📤 Upload Phone Screenshots
      uses: actions/upload-artifact@v4
      with:
        name: phone-screenshots-v${{ needs.build-and-test.outputs.version }}
        path: screenshots/phone/
        retention-days: 30

  # Финальная сборка релиза
  create-release:
    runs-on: ubuntu-latest
    needs: [setup-android-sdk, build-and-test, screenshots-phone]
    permissions:
      contents: write

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📥 Download APK
      uses: actions/download-artifact@v4
      with:
        name: FinancialSuccess-v${{ needs.build-and-test.outputs.version }}-${{ needs.build-and-test.outputs.date }}-debug.apk

    - name: 📥 Download Phone Screenshots
      uses: actions/download-artifact@v4
      with:
        name: phone-screenshots-v${{ needs.build-and-test.outputs.version }}

    - name: 📸 Prepare screenshots for repository
      run: |
        mkdir -p screenshots/phone
        
        # Проверяем наличие новых скриншотов
        if [ -d "screenshots/phone" ] && [ "$(ls -A screenshots/phone/)" ]; then
          echo "📱 Найдены новые скриншоты, подготавливаем для репозитория..."
          
          # Копируем только если есть новые файлы
          cp -r screenshots/phone/* screenshots/phone/ 2>/dev/null || true
          
          echo "📱 Phone screenshots:"
          ls -la screenshots/phone/
        else
          echo "📱 Новых скриншотов нет, пропускаем..."
        fi
        echo ""

    - name: 📝 Commit Screenshots to Repository
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add screenshots/
        if git diff --staged --quiet; then
          echo "No screenshots to commit"
        else
          git commit -m "📸 Auto-generated screenshots v${{ needs.build-and-test.outputs.version }} - ${{ needs.build-and-test.outputs.date }}
          
          📱 Screenshots:
          - Phone: $(ls screenshots/phone/*.png 2>/dev/null | wc -l) files
          - Total: $(find screenshots/ -name "*.png" 2>/dev/null | wc -l) files"
          git push
        fi

    - name: 🏷️ Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ needs.build-and-test.outputs.version }}-${{ needs.build-and-test.outputs.date }}
        name: "🎮 Financial Success v${{ needs.build-and-test.outputs.version }}"
        body_path: RELEASE_NOTES.md
        files: |
          releases/debug/*.apk
          screenshots/phone/*.png
        draft: false
        prerelease: false
        generate_release_notes: false

    - name: 📊 Build Summary
      run: |
        echo "🎉 Release completed successfully!"
        echo ""
        echo "📊 Results:"
        echo "🏷️ Version: ${{ needs.build-and-test.outputs.version }}"
        echo "🔢 Version Code: ${{ needs.build-and-test.outputs.version_code }}"
        echo "📅 Date: ${{ needs.build-and-test.outputs.date }}"
        echo "📱 APK: releases/debug/FinancialSuccess-v${{ needs.build-and-test.outputs.version }}-${{ needs.build-and-test.outputs.date }}-debug.apk"
        echo "📸 Phone screenshots: screenshots/phone/"
        echo ""
        echo "📁 Files:"
        ls -la releases/debug/ || echo "No APK files found"
        echo ""
        echo "📸 Phone screenshots:"
        ls -la screenshots/phone/ 2>/dev/null || echo "No phone screenshots"
