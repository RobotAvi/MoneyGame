        avdmanager list avd || echo "❌ avdmanager list avd failed"
        
        echo "📱 Создание AVD ci_nexus10..."
        if ! avdmanager list avd | grep -q "ci_nexus10"; then
          echo "📱 AVD ci_nexus10 не существует, создаем..."
          echo "no" | avdmanager create avd --name "ci_nexus10" --package "system-images;android-34;default;x86_64" --device "Nexus 10" || { echo "❌ ОШИБКА: Не удалось создать AVD"; exit 1; }
          echo "✅ AVD ci_nexus10 создан"
