name: 🚀 Stable Build & Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'releases/debug/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.configureondemand=true
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"

jobs:
  setup-android-sdk:
    runs-on: ubuntu-latest
    outputs:
      sdk-path: /home/runner/android-sdk
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      date: ${{ steps.date.outputs.date }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      - name: 📅 Get current date
        id: date
        run: echo "date=$(date '+%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
      - name: 🔖 Get version info
        id: version
        run: |
          echo "🔍 ==== ПОЛУЧЕНИЕ ВЕРСИИ ===="
          echo "🔍 Проверяем существование app/build.gradle..."
          ls -la app/build.gradle || echo "❌ app/build.gradle не найден"
          
          echo "🔍 Содержимое app/build.gradle:"
          cat app/build.gradle | grep -E "(versionName|versionCode)" || echo "❌ Не найдены versionName или versionCode"
          
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          VERSION_CODE=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle)
          
          echo "🔍 Извлеченная версия: $VERSION"
          echo "🔍 Извлеченный код версии: $VERSION_CODE"
          
          if [ -z "$VERSION" ]; then
            echo "❌ ОШИБКА: Не удалось извлечь versionName"
            exit 1
          fi
          if [ -z "$VERSION_CODE" ]; then
            echo "❌ ОШИБКА: Не удалось извлечь versionCode"
            exit 1
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "✅ Версия успешно извлечена: $VERSION ($VERSION_CODE)"
      - name: 🏗️ Prepare Android SDK directories
        id: set-sdk-path
        run: |
          echo "sdk_path=/home/runner/android-sdk" >> $GITHUB_OUTPUT
          mkdir -p /home/runner/android-sdk
          echo "ANDROID_SDK_ROOT=/home/runner/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/home/runner/android-sdk" >> $GITHUB_ENV
      - name: 🛠️ Download and install Android commandline tools
        run: |
          echo "🔧 ==== УСТАНОВКА ANDROID COMMANDLINE TOOLS ===="
          set -x
          
          echo "🔧 Обновление пакетов..."
          sudo apt-get update
          
          echo "🔧 Установка wget и unzip..."
          sudo apt-get install -y wget unzip
          
          echo "🔧 Загрузка commandline tools..."
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          echo "🔧 Размер скачанного файла:"
          ls -la cmdline-tools.zip
          
          echo "🔧 Распаковка commandline tools..."
          unzip cmdline-tools.zip -d $HOME
          echo "🔧 Содержимое $HOME после распаковки:"
          ls -la $HOME/ | grep cmdline
          
          echo "🔧 Создание структуры директорий..."
          mkdir -p $HOME/android-sdk/cmdline-tools
          mv $HOME/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          
          echo "🔧 ==== СТРУКТУРА CMDLINE-TOOLS ===="
          find $HOME/android-sdk/cmdline-tools/ -type f | head -20
          echo "🔧 Проверка sdkmanager:"
          ls -la $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager || echo "❌ sdkmanager не найден"
      - name: 🛠️ Install Android SDK components
        run: |
          echo "🔧 ==== УСТАНОВКА КОМПОНЕНТОВ ANDROID SDK ===="
          set -x
          
          echo "🔧 Настройка переменных окружения..."
          export ANDROID_SDK_ROOT=/home/runner/android-sdk
          export ANDROID_HOME=/home/runner/android-sdk
          export PATH="$PATH:/home/runner/android-sdk/emulator:/home/runner/android-sdk/platform-tools:/home/runner/android-sdk/cmdline-tools/latest/bin"
          
          echo "🔧 ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo "🔧 ANDROID_HOME: $ANDROID_HOME"
          echo "🔧 PATH: $PATH"
          
          echo "🔧 Проверка sdkmanager перед установкой..."
          which sdkmanager || echo "❌ sdkmanager не найден в PATH"
          ls -la $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager || echo "❌ sdkmanager не найден по пути"
          
          echo "🔧 Принятие лицензий..."
          yes | sdkmanager --licenses || { echo "❌ ОШИБКА: sdkmanager license error"; exit 1; }
          
          echo "🔧 Установка компонентов SDK..."
          echo "🔧 Устанавливаем: platform-tools, emulator, system-images;android-34;default;x86_64"
          sdkmanager "platform-tools" "emulator" "system-images;android-34;default;x86_64" || { echo "❌ ОШИБКА: sdkmanager install error"; exit 1; }
          
          echo "🔧 ==== ПРОВЕРКА УСТАНОВЛЕННЫХ КОМПОНЕНТОВ ===="
          echo "🔧 Структура SDK после установки:"
          find $ANDROID_SDK_ROOT/ -type d | head -20
          
          echo "🔧 Проверка platform-tools:"
          ls -la $ANDROID_SDK_ROOT/platform-tools/ || echo "❌ platform-tools не найден"
          
          echo "🔧 Проверка emulator:"
          ls -la $ANDROID_SDK_ROOT/emulator/ || echo "❌ emulator не найден"
          
          echo "🔧 Проверка system-images:"
          find $ANDROID_SDK_ROOT/system-images/ -type f | head -10 || echo "❌ system-images не найден"
          
          # Установка прав на выполнение для всех исполняемых файлов
          echo "🔧 ==== УСТАНОВКА ПРАВ НА ВЫПОЛНЕНИЕ ===="
          echo "🔧 Установка прав на выполнение для SDK файлов..."
          chmod +x $ANDROID_SDK_ROOT/platform-tools/* || echo "⚠️ Не удалось установить права для platform-tools"
          chmod +x $ANDROID_SDK_ROOT/emulator/* || echo "⚠️ Не удалось установить права для emulator"
          chmod +x $ANDROID_SDK_ROOT/emulator/qemu/linux-x86_64/* || echo "⚠️ Не удалось установить права для qemu"
          chmod +x $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/* || echo "⚠️ Не удалось установить права для cmdline-tools"
          
          echo "🔧 ==== ПРОВЕРКА ПРАВ НА ВЫПОЛНЕНИЕ ===="
          echo "🔧 Права на adb:"
          ls -la $ANDROID_SDK_ROOT/platform-tools/adb || echo "❌ adb не найден"
          
          echo "🔧 Права на emulator:"
          ls -la $ANDROID_SDK_ROOT/emulator/emulator || echo "❌ emulator не найден"
          
          echo "🔧 Права на avdmanager:"
          ls -la $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager || echo "❌ avdmanager не найден"
          
          echo "🔧 ==== ФИНАЛЬНАЯ ПРОВЕРКА ===="
          echo "🔧 Проверка system-images после установки:"
          find $ANDROID_SDK_ROOT/system-images/ || echo "❌ system-images dir not found"
          
          echo "🔧 Проверка доступности команд:"
          $ANDROID_SDK_ROOT/platform-tools/adb version || echo "❌ adb version failed"
          $ANDROID_SDK_ROOT/emulator/emulator -version || echo "❌ emulator version failed"
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager list avd || echo "❌ avdmanager failed"
      - name: 📦 Upload Android SDK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-sdk
          path: ${{ env.ANDROID_SDK_ROOT }}

  # Сборка и тестирование APK
  build-and-test:
    runs-on: ubuntu-latest
    needs: setup-android-sdk
    outputs:
      version: ${{ needs.setup-android-sdk.outputs.version }}
      version_code: ${{ needs.setup-android-sdk.outputs.version_code }}
      date: ${{ needs.setup-android-sdk.outputs.date }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: Remove default GitHub Actions credentials
        run: git config --local --remove-section http."https://github.com/" || true
        
      - name: 🔧 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: 📦 Download Android SDK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-sdk
          path: /home/runner/android-sdk
          
      - name: 🔧 Восстановление прав на выполнение (Build)
        run: |
          echo "🔧 ==== ВОССТАНОВЛЕНИЕ ПРАВ НА ВЫПОЛНЕНИЕ (BUILD) ===="
          echo "🔧 ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo "🔧 Проверяем существование SDK:"
          ls -la /home/runner/android-sdk/ || echo "❌ SDK не найден"
          
          echo "🔧 Устанавливаем права на выполнение для всех SDK файлов..."
          chmod +x /home/runner/android-sdk/platform-tools/* || echo "⚠️ Не удалось установить права для platform-tools"
          chmod +x /home/runner/android-sdk/emulator/* || echo "⚠️ Не удалось установить права для emulator"
          chmod +x /home/runner/android-sdk/emulator/qemu/linux-x86_64/* || echo "⚠️ Не удалось установить права для qemu"
          chmod +x /home/runner/android-sdk/cmdline-tools/latest/bin/* || echo "⚠️ Не удалось установить права для cmdline-tools"
          
          echo "🔧 ==== ПРОВЕРКА ПРАВ ПОСЛЕ ВОССТАНОВЛЕНИЯ ===="
          echo "🔧 Права на adb:"
          ls -la /home/runner/android-sdk/platform-tools/adb | grep -E "^-r.x" || echo "❌ adb не имеет прав на выполнение"
          
          echo "🔧 Права на emulator:"
          ls -la /home/runner/android-sdk/emulator/emulator | grep -E "^-r.x" || echo "❌ emulator не имеет прав на выполнение"
          
          echo "🔧 ==== ТЕСТИРОВАНИЕ КОМАНД ===="
          echo "🔧 Тест adb:"
          /home/runner/android-sdk/platform-tools/adb version || echo "❌ adb version failed"
          
          echo "🔧 Тест emulator:"
          /home/runner/android-sdk/emulator/emulator -version || echo "❌ emulator version failed"
          
      - name: 🏗️ Build APK
        run: |
          echo "🏗️ ==== СБОРКА APK ===="
          echo "🏗️ Настройка переменных окружения..."
          export ANDROID_SDK_ROOT=/home/runner/android-sdk
          export ANDROID_HOME=/home/runner/android-sdk
          export PATH="$PATH:/home/runner/android-sdk/platform-tools:/home/runner/android-sdk/cmdline-tools/latest/bin"
          
          echo "🏗️ ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo "🏗️ ANDROID_HOME: $ANDROID_HOME"
          echo "🏗️ PATH: $PATH"
          
          echo "🏗️ Проверка Gradle wrapper..."
          ls -la ./gradlew || echo "❌ gradlew не найден"
          chmod +x ./gradlew || echo "⚠️ Не удалось установить права на gradlew"
          
          echo "🏗️ Проверка app/build.gradle..."
          ls -la app/build.gradle || echo "❌ app/build.gradle не найден"
          cat app/build.gradle | grep -E "(versionName|versionCode|applicationId)" || echo "❌ Не найдены ключевые параметры"
          
          echo "🏗️ Очистка проекта..."
          ./gradlew clean || { echo "❌ ОШИБКА: gradlew clean failed"; exit 1; }
          
          echo "🏗️ Сборка debug APK..."
          ./gradlew assembleDebug || { echo "❌ ОШИБКА: gradlew assembleDebug failed"; exit 1; }
          
          echo "🏗️ ==== ПРОВЕРКА СОБРАННОГО APK ===="
          echo "🏗️ Поиск APK файлов..."
          find . -name "*.apk" -type f || echo "❌ APK файлы не найдены"
          
          echo "🏗️ Проверка app/build/outputs/apk/debug/..."
          ls -la app/build/outputs/apk/debug/ || echo "❌ debug APK директория не найдена"
          
          echo "🏗️ Создание директории releases/debug..."
          mkdir -p releases/debug
          
          echo "🏗️ Копирование APK..."
          cp app/build/outputs/apk/debug/app-debug.apk releases/debug/latest-debug.apk || { echo "❌ ОШИБКА: Не удалось скопировать APK"; exit 1; }
          
          echo "🏗️ Проверка скопированного APK..."
          ls -la releases/debug/latest-debug.apk || echo "❌ APK не найден в releases/debug/"
          
          echo "🏗️ Размер APK:"
          du -h releases/debug/latest-debug.apk || echo "❌ Не удалось получить размер APK"
          
          echo "🏗️ Проверка APK через aapt..."
          /home/runner/android-sdk/build-tools/*/aapt dump badging releases/debug/latest-debug.apk | head -10 || echo "❌ aapt failed"
          
      - name: 📦 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinancialSuccess-v${{ needs.setup-android-sdk.outputs.version }}-${{ needs.setup-android-sdk.outputs.date }}
          path: releases/debug/latest-debug.apk

      - name: Bump version in build.gradle
        run: |
          VERSION_LINE=$(grep -n 'versionName' app/build.gradle | cut -d: -f1)
          CODE_LINE=$(grep -n 'versionCode' app/build.gradle | cut -d: -f1)
          CURR_VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          CURR_CODE=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle)
          NEW_CODE=$((CURR_CODE+1))
          # Увеличиваем минорную версию
          MAJOR=$(echo $CURR_VERSION | cut -d. -f1)
          MINOR=$(echo $CURR_VERSION | cut -d. -f2)
          if [ -z "$MINOR" ]; then MINOR=0; fi
          NEW_MINOR=$((MINOR+1))
          NEW_VERSION="$MAJOR.$NEW_MINOR"
          sed -i "${CODE_LINE}s/versionCode.*/versionCode $NEW_CODE/" app/build.gradle
          sed -i "${VERSION_LINE}s/versionName.*/versionName \"$NEW_VERSION\"/" app/build.gradle
          echo "Bumped version to $NEW_VERSION ($NEW_CODE)"

      - name: Commit APK and version bump to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/debug/*.apk app/build.gradle
          git commit -m "Update APK and bump version [skip ci]"
          git pull --rebase origin main || true
          git push https://x-access-token:${GH_PAT}@github.com/RobotAvi/MoneyGame.git HEAD:main
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

  # Параллельная генерация скриншотов для телефона
  screenshots-phone:
    runs-on: ubuntu-latest
    needs: [setup-android-sdk, build-and-test]
    env:
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      ANDROID_HOME: /home/runner/android-sdk
    # Убрано условие should_release
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Download Android SDK artifact
      uses: actions/download-artifact@v4
      with:
        name: android-sdk
        path: ${{ env.ANDROID_SDK_ROOT }}
        
    - name: 📦 Download APK artifact
      uses: actions/download-artifact@v4
      with:
        name: FinancialSuccess-v${{ needs.build-and-test.outputs.version }}-${{ needs.build-and-test.outputs.date }}
        path: releases/debug/
        
    - name: 🧾 Log Android SDK structure
      run: |
        echo "🔍 ==== ПРОВЕРКА ЗАГРУЖЕННОГО ANDROID SDK (PHONE) ===="
        echo "🔍 ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
        echo "🔍 Проверяем существование директории:"
        ls -la $ANDROID_SDK_ROOT/ || echo "❌ ANDROID_SDK_ROOT не существует"
        
        echo "🔍 ==== СТРУКТУРА SDK ===="
        find $ANDROID_SDK_ROOT/ -type d | head -20
        
        echo "🔍 ==== ПРОВЕРКА КРИТИЧЕСКИХ ФАЙЛОВ ===="
        echo "🔍 Проверка adb:"
        ls -la $ANDROID_SDK_ROOT/platform-tools/adb || echo "❌ adb не найден"
        
        echo "🔍 Проверка emulator:"
        ls -la $ANDROID_SDK_ROOT/emulator/emulator || echo "❌ emulator не найден"
        
        echo "🔍 Проверка avdmanager:"
        ls -la $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager || echo "❌ avdmanager не найден"
        
        echo "🔍 Проверка system-images:"
        find $ANDROID_SDK_ROOT/system-images/ -name "*.img" | head -5 || echo "❌ system-images не найдены"
        
        echo "🔍 ==== ПРОВЕРКА ПРАВ НА ВЫПОЛНЕНИЕ ===="
        echo "🔍 Права на adb:"
        ls -la $ANDROID_SDK_ROOT/platform-tools/adb | grep -E "^-r.x" || echo "❌ adb не имеет прав на выполнение"
        
        echo "🔍 Права на emulator:"
        ls -la $ANDROID_SDK_ROOT/emulator/emulator | grep -E "^-r.x" || echo "❌ emulator не имеет прав на выполнение"
        
        echo "🔍 Права на avdmanager:"
        ls -la $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager | grep -E "^-r.x" || echo "❌ avdmanager не имеет прав на выполнение"
    
    - name: 🔧 Восстановление прав на выполнение (Phone)
      run: |
        echo "🔧 ==== ВОССТАНОВЛЕНИЕ ПРАВ НА ВЫПОЛНЕНИЕ ===="
        echo "🔧 Устанавливаем права на выполнение для всех SDK файлов..."
        
        chmod +x $ANDROID_SDK_ROOT/platform-tools/* || echo "⚠️ Не удалось установить права для platform-tools"
        chmod +x $ANDROID_SDK_ROOT/emulator/* || echo "⚠️ Не удалось установить права для emulator"
        chmod +x $ANDROID_SDK_ROOT/emulator/qemu/linux-x86_64/* || echo "⚠️ Не удалось установить права для qemu"
        chmod +x $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/* || echo "⚠️ Не удалось установить права для cmdline-tools"
        
        echo "🔧 ==== ПРОВЕРКА ПРАВ ПОСЛЕ ВОССТАНОВЛЕНИЯ ===="
        echo "🔧 Права на adb:"
        ls -la $ANDROID_SDK_ROOT/platform-tools/adb | grep -E "^-r.x" || echo "❌ adb не имеет прав на выполнение"
        
        echo "🔧 Права на emulator:"
        ls -la $ANDROID_SDK_ROOT/emulator/emulator | grep -E "^-r.x" || echo "❌ emulator не имеет прав на выполнение"
        
        echo "🔧 Права на avdmanager:"
        ls -la $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager | grep -E "^-r.x" || echo "❌ avdmanager не имеет прав на выполнение"
        
        echo "🔧 ==== ТЕСТИРОВАНИЕ КОМАНД ===="
        echo "🔧 Тест adb:"
        $ANDROID_SDK_ROOT/platform-tools/adb version || echo "❌ adb version failed"
        
        echo "🔧 Тест emulator:"
        $ANDROID_SDK_ROOT/emulator/emulator -version || echo "❌ emulator version failed"
        
        echo "🔧 Тест avdmanager:"
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager list avd || echo "❌ avdmanager failed"

    - name: 🔍 Проверка наличия adb в PATH (phone)
      run: |
        echo "🔍 Установка зависимостей для adb..."
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y libc6:i386 libstdc++6:i386 lib32z1 lib32stdc++6
        
        echo "🔍 Настройка PATH для adb..."
        export PATH="$PATH:/home/runner/android-sdk/platform-tools"
        echo "PATH: $PATH"
        
        echo "🔍 Проверка наличия adb..."
        echo "🔍 Проверяем существование файла adb..."
        ls -la /home/runner/android-sdk/platform-tools/adb || echo "❌ Файл adb не найден"
        
        echo "🔍 Проверяем права на выполнение..."
        file /home/runner/android-sdk/platform-tools/adb || echo "❌ Не удалось определить тип файла"
        
        echo "🔍 Попытка запуска adb по полному пути..."
        /home/runner/android-sdk/platform-tools/adb version || echo "❌ adb version failed"
        
        echo "🔍 Попытка запуска adb через which..."
        which adb || echo "❌ which adb failed"
        
        echo "🔍 Проверка библиотек adb..."
        ldd /home/runner/android-sdk/platform-tools/adb || echo "❌ ldd failed"

    - name: 🎭 Install Maestro
      run: |
        curl -Ls "https://get.maestro.mobile.dev" | bash
        export PATH="$PATH:$HOME/.maestro/bin"
        echo "n" | maestro --version

    - name: 📱 Start Android Emulator and Install APK (Phone)
      shell: bash
      env:
        ANDROID_SDK_ROOT: /home/runner/android-sdk
        ANDROID_HOME: /home/runner/android-sdk
      run: |
        echo "📱 ==== ЗАПУСК ЭМУЛЯТОРА ТЕЛЕФОНА ===="
        export PATH="$PATH:/home/runner/android-sdk/emulator:/home/runner/android-sdk/platform-tools:/home/runner/android-sdk/cmdline-tools/latest/bin"
        set -e
        
        echo "📱 Настройка переменных окружения..."
        echo "📱 SDK root: $ANDROID_SDK_ROOT"
        echo "📱 ANDROID_HOME: $ANDROID_HOME"
        echo "📱 PATH: $PATH"
        
        echo "📱 Проверка system-images..."
        ls -la $ANDROID_SDK_ROOT/system-images/android-34/default/x86_64/ || echo "❌ system-images не найдены"
        
        echo "📱 Очистка старых AVD..."
        rm -rf ~/.android/avd/*
        echo "📱 Содержимое ~/.android/avd/ после очистки:"
        ls -la ~/.android/avd/ || echo "❌ ~/.android/avd/ не существует"

        echo "📱 ==== СОЗДАНИЕ AVD ===="
        echo "📱 Проверка существующих AVD..."
        avdmanager list avd || echo "❌ avdmanager list avd failed"
        
        echo "📱 Создание AVD ci_nexus5..."
        if ! avdmanager list avd | grep -q "ci_nexus5"; then
          echo "📱 AVD ci_nexus5 не существует, создаем..."
          echo "no" | avdmanager create avd --name "ci_nexus5" --package "system-images;android-34;default;x86_64" --device "Nexus 5" || { echo "❌ ОШИБКА: Не удалось создать AVD"; exit 1; }
          echo "✅ AVD ci_nexus5 создан"
        else
          echo "✅ AVD ci_nexus5 уже существует"
        fi
        
        echo "📱 Проверка созданного AVD..."
        avdmanager list avd | grep ci_nexus5 || echo "❌ AVD ci_nexus5 не найден в списке"

        echo "📱 ==== ЗАПУСК ЭМУЛЯТОРА ===="
        echo "📱 Запуск эмулятора в фоне..."
        emulator -avd "ci_nexus5" -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -accel off -no-snapshot -no-metrics -verbose &
        EMULATOR_PID=$!
        echo "📱 PID эмулятора: $EMULATOR_PID"
        
        echo "📱 Проверка процесса эмулятора..."
        ps aux | grep emulator | grep -v grep || echo "❌ Процесс эмулятора не найден"

        echo "📱 Пауза после запуска эмулятора (30 секунд)..."
        sleep 30
        
        echo "📱 Проверка процесса эмулятора после паузы..."
        ps aux | grep emulator | grep -v grep || echo "❌ Процесс эмулятора не найден после паузы"

        echo "📱 ==== ОЖИДАНИЕ ПОЯВЛЕНИЯ В ADB ===="
        emulator_timeout=120
        emulator_elapsed=0
        for i in {1..60}; do
          echo "📱 Попытка $i/60: проверка adb devices..."
          adb devices || echo "❌ adb devices failed"
          
          if adb devices | grep -q "emulator"; then
            echo "✅ Эмулятор появился в adb"
            echo "📱 Полный список устройств:"
            adb devices
            break
          fi
          
          if [ $i -eq 60 ]; then
            echo "❌ Не удалось запустить эмулятор за $emulator_timeout секунд"
            echo "📱 Логи эмулятора:"
            ps aux | grep emulator | grep -v grep || echo "❌ Процесс эмулятора не найден"
            kill $EMULATOR_PID 2>/dev/null || true
            exit 1
          fi
          
          sleep 2
          emulator_elapsed=$((emulator_elapsed + 2))
          if [ $((emulator_elapsed % 30)) -eq 0 ]; then
            echo "⏳ Ожидание эмулятора: $emulator_elapsed секунд из $emulator_timeout..."
            echo "📱 Проверка процесса эмулятора:"
            ps aux | grep emulator | grep -v grep || echo "❌ Процесс эмулятора не найден"
          fi
        done

        echo "📱 ==== ОЖИДАНИЕ ЗАГРУЗКИ ANDROID ===="
        boot_timeout=600
        boot_elapsed=0
        for i in {1..150}; do
          echo "📱 Попытка $i/150: проверка sys.boot_completed..."
          adb shell getprop sys.boot_completed 2>/dev/null || echo "❌ adb shell getprop failed"
          
          if adb shell getprop sys.boot_completed 2>/dev/null | grep -q "1"; then
            echo "✅ Android полностью загружен"
            echo "📱 Дополнительные свойства загрузки:"
            adb shell getprop | grep -E "(sys.boot_completed|init.svc.bootanim|init.svc.zygote)" || echo "❌ Не удалось получить свойства"
            break
          fi
          
          if [ $i -eq 150 ]; then
            echo "❌ Android не загрузился за $boot_timeout секунд"
            echo "📱 Последние свойства загрузки:"
            adb shell getprop | grep -E "(sys.boot_completed|init.svc.bootanim|init.svc.zygote)" || echo "❌ Не удалось получить свойства"
            echo "📋 === LOGCAT (последние 200 строк) ==="
            adb logcat -d | tail -200 || echo "logcat failed"
            echo "📋 === EMULATOR STATUS ==="
            adb -s emulator-5554 emu avd status || echo "emu avd status failed"
            kill $EMULATOR_PID 2>/dev/null || true
            exit 1
          fi
          
          sleep 2
          boot_elapsed=$((boot_elapsed + 2))
          if [ $((boot_elapsed % 30)) -eq 0 ]; then
            echo "⏳ Ожидание загрузки Android: $boot_elapsed секунд из $boot_timeout..."
            echo "📱 Проверка процесса эмулятора:"
            ps aux | grep emulator | grep -v grep || echo "❌ Процесс эмулятора не найден"
          fi
        done

        echo "📱 ==== РАЗБЛОКИРОВКА ЭКРАНА ===="
        echo "📱 Разблокировка экрана..."
        adb shell input keyevent 82 || echo "❌ keyevent 82 failed"
        adb shell input keyevent 82 || echo "❌ keyevent 82 failed"
        sleep 2

        echo "📱 ==== УСТАНОВКА APK ===="
        echo "📱 Проверка наличия APK..."
        if [ ! -f "releases/debug/latest-debug.apk" ]; then
          echo "❌ Error: latest-debug.apk not found in releases/debug/"
          echo "📱 Содержимое releases/debug/:"
          ls -la releases/debug/ || echo "❌ releases/debug/ не существует"
          echo "📱 Поиск APK файлов в проекте:"
          find . -name "*.apk" -type f || echo "❌ APK файлы не найдены"
          kill $EMULATOR_PID 2>/dev/null || true
          exit 1
        fi
        
        echo "📱 Размер APK:"
        du -h releases/debug/latest-debug.apk || echo "❌ Не удалось получить размер APK"
        
        echo "📱 Установка APK..."
        adb install releases/debug/latest-debug.apk || { echo "❌ ОШИБКА: adb install failed"; kill $EMULATOR_PID 2>/dev/null || true; exit 1; }
        
        echo "📱 Проверка установки APK..."
        adb shell pm list packages | grep financialsuccess || echo "❌ Пакет financialsuccess не найден"
        
        if adb shell pm list packages | grep -q financialsuccess; then
          echo "✅ APK успешно установлен"
          echo "📱 Информация о пакете:"
          adb shell pm dump financialsuccess | head -20 || echo "❌ Не удалось получить информацию о пакете"
        else
          echo "❌ Error: APK installation failed"
          echo "📱 Список всех пакетов:"
          adb shell pm list packages | head -20 || echo "❌ Не удалось получить список пакетов"
          kill $EMULATOR_PID 2>/dev/null || true
          exit 1
        fi

        echo "📱 ==== ЗАВЕРШЕНИЕ РАБОТЫ ===="
        echo "📱 Остановка эмулятора..."
        kill $EMULATOR_PID 2>/dev/null || true
        pkill -f emulator 2>/dev/null || true
        
        echo "📱 Проверка остановки эмулятора..."
        sleep 5
        ps aux | grep emulator | grep -v grep || echo "✅ Эмулятор остановлен"

    - name: 📸 Run Maestro Screenshots (Phone)
      run: |
        export PATH="$PATH:$HOME/.maestro/bin"
        mkdir -p screenshots/phone
        # Пробуем специфичную конфигурацию для телефона
        config_file="maestro/screenshots-stable.yaml"
        if [ ! -f "$config_file" ]; then
          config_file="maestro/screenshots.yaml"
        fi
        if [ -f "$config_file" ]; then
          echo "Using phone screenshots configuration: $config_file"
          maestro test "$config_file" --format junit --output screenshots/phone/
          echo "📱 Phone screenshots completed!"
        else
          echo "⚠️ Warning: Maestro configuration file not found: $config_file"
          echo "📱 Phone screenshots skipped!"
        fi
    - name: 📱 Stop Android Emulator (Phone)
      run: |
        echo "📱 Остановка эмулятора..."
        kill $EMULATOR_PID 2>/dev/null || true
        pkill -f emulator 2>/dev/null || true
        echo "📱 Проверка остановки эмулятора..."
        sleep 5
        ps aux | grep emulator | grep -v grep || echo "✅ Эмулятор остановлен"

    - name: 📤 Upload Phone Screenshots
      uses: actions/upload-artifact@v4
      with:
        name: phone-screenshots-v${{ needs.build-and-test.outputs.version }}
        path: screenshots/phone/
        retention-days: 30

  # Параллельная генерация скриншотов для планшета
  screenshots-tablet:
    runs-on: ubuntu-latest
    needs: [setup-android-sdk, build-and-test]
    env:
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      ANDROID_HOME: /home/runner/android-sdk
    # Убрано условие should_release
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Download Android SDK artifact
      uses: actions/download-artifact@v4
      with:
        name: android-sdk
        path: ${{ env.ANDROID_SDK_ROOT }}
        
    - name: 📦 Download APK artifact
      uses: actions/download-artifact@v4
      with:
        name: FinancialSuccess-v${{ needs.build-and-test.outputs.version }}-${{ needs.build-and-test.outputs.date }}
        path: releases/debug/
        
    - name: 🧾 Log Android SDK structure
      run: |
        echo "🔍 ==== ПРОВЕРКА ЗАГРУЖЕННОГО ANDROID SDK (TABLET) ===="
        echo "🔍 ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
        echo "🔍 Проверяем существование директории:"
        ls -la $ANDROID_SDK_ROOT/ || echo "❌ ANDROID_SDK_ROOT не существует"
        
        echo "🔍 ==== СТРУКТУРА SDK ===="
        find $ANDROID_SDK_ROOT/ -type d | head -20
        
        echo "🔍 ==== ПРОВЕРКА КРИТИЧЕСКИХ ФАЙЛОВ ===="
        echo "🔍 Проверка adb:"
        ls -la $ANDROID_SDK_ROOT/platform-tools/adb || echo "❌ adb не найден"
        
        echo "🔍 Проверка emulator:"
        ls -la $ANDROID_SDK_ROOT/emulator/emulator || echo "❌ emulator не найден"
        
        echo "🔍 Проверка avdmanager:"
        ls -la $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager || echo "❌ avdmanager не найден"
        
        echo "🔍 Проверка system-images:"
        find $ANDROID_SDK_ROOT/system-images/ -name "*.img" | head -5 || echo "❌ system-images не найдены"
        
        echo "🔍 ==== ПРОВЕРКА ПРАВ НА ВЫПОЛНЕНИЕ ===="
        echo "🔍 Права на adb:"
        ls -la $ANDROID_SDK_ROOT/platform-tools/adb | grep -E "^-r.x" || echo "❌ adb не имеет прав на выполнение"
        
        echo "🔍 Права на emulator:"
        ls -la $ANDROID_SDK_ROOT/emulator/emulator | grep -E "^-r.x" || echo "❌ emulator не имеет прав на выполнение"
        
        echo "🔍 Права на avdmanager:"
        ls -la $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager | grep -E "^-r.x" || echo "❌ avdmanager не имеет прав на выполнение"
    
    - name: 🔧 Восстановление прав на выполнение (Tablet)
      run: |
        echo "🔧 ==== ВОССТАНОВЛЕНИЕ ПРАВ НА ВЫПОЛНЕНИЕ ===="
        echo "🔧 Устанавливаем права на выполнение для всех SDK файлов..."
        
        chmod +x $ANDROID_SDK_ROOT/platform-tools/* || echo "⚠️ Не удалось установить права для platform-tools"
        chmod +x $ANDROID_SDK_ROOT/emulator/* || echo "⚠️ Не удалось установить права для emulator"
        chmod +x $ANDROID_SDK_ROOT/emulator/qemu/linux-x86_64/* || echo "⚠️ Не удалось установить права для qemu"
        chmod +x $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/* || echo "⚠️ Не удалось установить права для cmdline-tools"
        
        echo "🔧 ==== ПРОВЕРКА ПРАВ ПОСЛЕ ВОССТАНОВЛЕНИЯ ===="
        echo "🔧 Права на adb:"
        ls -la $ANDROID_SDK_ROOT/platform-tools/adb | grep -E "^-r.x" || echo "❌ adb не имеет прав на выполнение"
        
        echo "🔧 Права на emulator:"
        ls -la $ANDROID_SDK_ROOT/emulator/emulator | grep -E "^-r.x" || echo "❌ emulator не имеет прав на выполнение"
        
        echo "🔧 Права на avdmanager:"
        ls -la $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager | grep -E "^-r.x" || echo "❌ avdmanager не имеет прав на выполнение"
        
        echo "🔧 ==== ТЕСТИРОВАНИЕ КОМАНД ===="
        echo "🔧 Тест adb:"
        $ANDROID_SDK_ROOT/platform-tools/adb version || echo "❌ adb version failed"
        
        echo "🔧 Тест emulator:"
        $ANDROID_SDK_ROOT/emulator/emulator -version || echo "❌ emulator version failed"
        
        echo "🔧 Тест avdmanager:"
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager list avd || echo "❌ avdmanager failed"

    - name: 🔍 Проверка наличия adb в PATH (tablet)
      run: |
        echo "🔍 Установка зависимостей для adb..."
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y libc6:i386 libstdc++6:i386 lib32z1 lib32stdc++6
        
        echo "🔍 Настройка PATH для adb..."
        export PATH="$PATH:/home/runner/android-sdk/platform-tools"
        echo "PATH: $PATH"
        
        echo "🔍 Проверка наличия adb..."
        echo "🔍 Проверяем существование файла adb..."
        ls -la /home/runner/android-sdk/platform-tools/adb || echo "❌ Файл adb не найден"
        
        echo "🔍 Проверяем права на выполнение..."
        file /home/runner/android-sdk/platform-tools/adb || echo "❌ Не удалось определить тип файла"
        
        echo "🔍 Попытка запуска adb по полному пути..."
        /home/runner/android-sdk/platform-tools/adb version || echo "❌ adb version failed"
        
        echo "🔍 Попытка запуска adb через which..."
        which adb || echo "❌ which adb failed"
        
        echo "🔍 Проверка библиотек adb..."
        ldd /home/runner/android-sdk/platform-tools/adb || echo "❌ ldd failed"

    - name: 🎭 Install Maestro
      run: |
        curl -Ls "https://get.maestro.mobile.dev" | bash
        export PATH="$PATH:$HOME/.maestro/bin"
        echo "n" | maestro --version

