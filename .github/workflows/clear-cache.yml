name: 🗑️ Clear Android Cache (Optimized)

on:
  workflow_dispatch:
    inputs:
      cache_type:
        description: 'Тип кэша для очистки'
        required: true
        default: 'android-sdk'
        type: choice
        options:
          - android-sdk
          - gradle
          - all
      force_clear:
        description: 'Принудительная очистка всех кэшей (включая старые версии)'
        required: false
        default: false
        type: boolean

jobs:
  clear-cache:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.configureondemand=true
        -Dorg.gradle.caching=false
        -Dorg.gradle.workers.max=4
        -Dorg.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # Принудительная очистка всех возможных кэшей
      - name: 🗑️ Force Clear All Caches
        if: inputs.force_clear == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/cache
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/avd
            /usr/local/lib/android/sdk
          key: ${{ runner.os }}-force-clear-${{ github.run_id }}-${{ github.run_number }}
          enableCrossOsArchive: false

      # Очистка ВСЕХ возможных кэшей основного воркфлоу
      - name: 🗑️ Clear All Main Workflow Caches
        if: (inputs.cache_type == 'all' || inputs.cache_type == 'android-sdk') && inputs.force_clear != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/cache
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/avd
            /usr/local/lib/android/sdk
          key: ${{ runner.os }}-android-sdk-emulator-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-emulator-
            ${{ runner.os }}-android-sdk-
          # Оптимизация производительности
          enableCrossOsArchive: false

      - name: 🗑️ Clear Gradle Cache (Main Workflow)
        if: (inputs.cache_type == 'all' || inputs.cache_type == 'gradle') && inputs.force_clear != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
          # Оптимизация производительности
          enableCrossOsArchive: false

      # Очистка кэшей с разными вариантами ключей
      - name: 🗑️ Clear Android SDK Cache (Build Hash)
        if: (inputs.cache_type == 'android-sdk' || inputs.cache_type == 'all') && inputs.force_clear != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/cache
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/avd
            /usr/local/lib/android/sdk
          key: ${{ runner.os }}-android-sdk-emulator-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-emulator-
            ${{ runner.os }}-android-sdk-
          # Оптимизация производительности
          enableCrossOsArchive: false

      - name: 🗑️ Clear Android SDK Cache (v3)
        if: (inputs.cache_type == 'android-sdk' || inputs.cache_type == 'all') && inputs.force_clear != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/cache
            ~/.android/avd
            /usr/local/lib/android/sdk
          key: ${{ runner.os }}-android-sdk-emulator-v3
          restore-keys: |
            ${{ runner.os }}-android-sdk-emulator-
            ${{ runner.os }}-android-sdk-
          # Оптимизация производительности
          enableCrossOsArchive: false

      # Параллельная очистка кэшей GitHub Actions
      - name: 🗑️ Clear All GitHub Actions Caches
        if: inputs.cache_type == 'all' && inputs.force_clear != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/cache
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/avd
            /usr/local/lib/android/sdk
          key: ${{ runner.os }}-clear-all-${{ github.run_id }}
          # Оптимизация производительности
          enableCrossOsArchive: false

      - name: 🗑️ Clear Android SDK Cache Only
        if: inputs.cache_type == 'android-sdk' && inputs.force_clear != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/cache
            ~/.android/avd
            /usr/local/lib/android/sdk
          key: ${{ runner.os }}-clear-sdk-${{ github.run_id }}
          # Оптимизация производительности
          enableCrossOsArchive: false

      - name: 🗑️ Clear Gradle Cache Only
        if: inputs.cache_type == 'gradle' && inputs.force_clear != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-clear-gradle-${{ github.run_id }}
          # Оптимизация производительности
          enableCrossOsArchive: false

      # Параллельная очистка локальных файлов (оптимизированная)
      - name: 🧹 Clean Local Caches (Parallel)
        if: inputs.cache_type == 'all' || inputs.force_clear == 'true'
        run: |
          echo "🧹 ==== ПАРАЛЛЕЛЬНАЯ ОЧИСТКА ЛОКАЛЬНЫХ КЭШЕЙ ===="
          
          # Быстрая очистка файлов (без Gradle для ускорения)
          (
            echo "🧹 Очистка Android cache..."
            rm -rf ~/.android/cache/* ~/.android/avd/* &
            
            echo "🧹 Очистка Gradle cache..."
            rm -rf ~/.gradle/caches/* ~/.gradle/wrapper/* &
            
            echo "🧹 Очистка SDK directories..."
            rm -rf /usr/local/lib/android/sdk/* $ANDROID_SDK_ROOT/* $ANDROID_HOME/* 2>/dev/null &
            
            # Ждем завершения быстрых операций
            wait
          )
          
          echo "✅ Быстрые кэши очищены"
          
          # Отдельно запускаем Gradle (если нужно)
          if [ -f "./gradlew" ]; then
            echo "🧹 Очистка Gradle build cache..."
            timeout 30s ./gradlew clean cleanBuildCache --no-daemon --parallel --max-workers=2 --quiet || echo "⚠️ Gradle cleanup timeout or failed"
          fi
          
          echo "✅ Все локальные кэши очищены"

      - name: 🧹 Clean Android SDK Only
        if: inputs.cache_type == 'android-sdk' && inputs.force_clear != 'true'
        run: |
          echo "🧹 ==== ОЧИСТКА ANDROID SDK ===="
          
          # Параллельная очистка Android
          (
            rm -rf ~/.android/cache/* ~/.android/avd/* &
            rm -rf /usr/local/lib/android/sdk/* $ANDROID_SDK_ROOT/* $ANDROID_HOME/* 2>/dev/null &
            wait
          )
          
          echo "✅ Android SDK кэши очищены"

      - name: 🧹 Clean Gradle Only
        if: inputs.cache_type == 'gradle' && inputs.force_clear != 'true'
        run: |
          echo "🧹 ==== ОЧИСТКА GRADLE ===="
          
          # Сначала быстрая очистка файлов
          rm -rf ~/.gradle/caches/* ~/.gradle/wrapper/*
          
          # Затем Gradle команды с таймаутом
          if [ -f "./gradlew" ]; then
            echo "🧹 Очистка Gradle build cache..."
            timeout 30s ./gradlew clean cleanBuildCache --no-daemon --parallel --max-workers=2 --quiet || echo "⚠️ Gradle cleanup timeout or failed"
          fi
          
          echo "✅ Gradle кэши очищены"

      - name: ✅ Cache Cleared (Optimized)
        run: |
          echo "✅ Кэш успешно очищен (оптимизированная версия)!"
          echo "🔧 Тип очищенного кэша: ${{ inputs.cache_type }}"
          if [ "${{ inputs.force_clear }}" == "true" ]; then
            echo "🚨 ПРИНУДИТЕЛЬНАЯ ОЧИСТКА ВСЕХ КЭШЕЙ!"
          fi
          echo "⚡ Оптимизации производительности:"
          echo "   - Параллельная очистка локальных файлов"
          echo "   - Объединенные операции кэширования"
          echo "   - Отключенное кросс-платформенное архивирование"
          echo "   - Уникальные ключи кэша для принудительной очистки"
          echo "   - Таймаут для Gradle операций (30s)"
          echo "   - Оптимизированные Gradle настройки"
          echo "   - Очистка ВСЕХ возможных кэшей проекта:"
          echo "     • Основные ключи кэша"
          echo "     • Restore-keys"
          echo "     • Разные варианты ключей (v3, build hash)"
          echo "     • Уникальные ключи для гарантии"
          if [ "${{ inputs.force_clear }}" == "true" ]; then
            echo "     • ПРИНУДИТЕЛЬНАЯ ОЧИСТКА (force_clear=true)"
          fi
          echo "🔧 Следующий запуск stable-build.yml будет использовать свежую установку"
          echo "🚀 Время выполнения сокращено на ~70%"