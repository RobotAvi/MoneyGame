name: 🗑️ Clear All Caches

on:
  workflow_dispatch:

jobs:
  clear-cache:
    runs-on: ubuntu-latest
    env:
      BUILD_OPTS: >-
        -Dorg.build.daemon=false
        -Dorg.build.parallel=true
        -Dorg.build.configureondemand=true
        -Dorg.build.caching=false
        -Dorg.build.workers.max=4
        -Dorg.build.jvmargs=-Xmx2g -XX:+UseParallelGC
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # Установка jq для парсинга JSON
      - name: 🔧 Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # Улучшенная очистка всех кэшей
      - name: 🗑️ Clear All Caches Improved
        run: |
          echo "🔍 Получение списка всех кэшей..."
          
          # Получаем все кэши через API с обработкой ошибок
          CACHES_RESPONSE=$(curl -s -H "Authorization: token ${{ github.token }}" \
                        -H "Accept: application/vnd.github.v3+json" \
                        "https://api.github.com/repos/${{ github.repository }}/actions/caches")
          
          echo "📊 Ответ API: $CACHES_RESPONSE"
          
          # Извлекаем ключи кэшей
          CACHES=$(echo "$CACHES_RESPONSE" | jq -r '.actions_caches[] | .key' 2>/dev/null || echo "")
          
          # Подсчитываем количество кэшей в начале
          CACHE_COUNT_BEFORE=$(echo "$CACHES" | grep -c . || echo "0")
          echo "📊 Кэшей в начале: $CACHE_COUNT_BEFORE"
          
          if [ -n "$CACHES" ] && [ "$CACHE_COUNT_BEFORE" -gt 0 ]; then
            echo "🗑️ Найдено кэшей: $CACHE_COUNT_BEFORE"
            echo "🧹 Очистка всех кэшей..."
            
            # Очищаем каждый кэш последовательно для надежности
            CLEARED_COUNT=0
            while IFS= read -r cache_key; do
              if [ -n "$cache_key" ]; then
                echo "🗑️ Очистка кэша: $cache_key"
                DELETE_RESPONSE=$(curl -s -X DELETE \
                     -H "Authorization: token ${{ github.token }}" \
                     -H "Accept: application/vnd.github.v3+json" \
                     "https://api.github.com/repos/${{ github.repository }}/actions/caches?key=$cache_key")
                
                if [ $? -eq 0 ]; then
                  echo "✅ Кэш удален: $cache_key"
                  ((CLEARED_COUNT++))
                else
                  echo "❌ Ошибка удаления кэша: $cache_key"
                fi
              fi
            done <<< "$CACHES"
            
            echo "✅ Успешно очищено $CLEARED_COUNT кэшей"
          else
            echo "ℹ️ Кэши не найдены"
          fi
          
          # Проверяем количество кэшей в конце
          echo "🔍 Проверка кэшей после очистки..."
          CACHES_AFTER_RESPONSE=$(curl -s -H "Authorization: token ${{ github.token }}" \
                              -H "Accept: application/vnd.github.v3+json" \
                              "https://api.github.com/repos/${{ github.repository }}/actions/caches")
          CACHES_AFTER=$(echo "$CACHES_AFTER_RESPONSE" | jq -r '.actions_caches[] | .key' 2>/dev/null || echo "")
          CACHE_COUNT_AFTER=$(echo "$CACHES_AFTER" | grep -c . || echo "0")
          echo "📊 Кэшей в конце: $CACHE_COUNT_AFTER"
          
          # Выводим результат
          if [ "$CACHE_COUNT_BEFORE" -gt 0 ] && [ "$CACHE_COUNT_AFTER" -eq 0 ]; then
            echo "🎉 Успешно очищено все $CACHE_COUNT_BEFORE кэшей!"
          elif [ "$CACHE_COUNT_BEFORE" -eq 0 ]; then
            echo "ℹ️ Кэши не были найдены для очистки"
          else
            REMAINING=$((CACHE_COUNT_BEFORE - CACHE_COUNT_AFTER))
            echo "⚠️ Очищено $REMAINING из $CACHE_COUNT_BEFORE кэшей"
            echo "📋 Оставшиеся кэши:"
            echo "$CACHES_AFTER" | head -10
          fi

      # Очистка локальных файлов
      - name: 🧹 Clear Local Files
        run: |
          echo "🧹 Очистка локальных файлов..."
          
          # Очищаем Gradle кэши
          if [ -d "$HOME/.gradle" ]; then
            echo "🧹 Очистка Gradle кэша..."
            rm -rf "$HOME/.gradle/caches" 2>/dev/null || true
            rm -rf "$HOME/.gradle/wrapper" 2>/dev/null || true
          fi
          
          # Очищаем Android SDK кэши
          if [ -d "$ANDROID_HOME" ]; then
            echo "🧹 Очистка Android SDK кэша..."
            rm -rf "$ANDROID_HOME/.temp" 2>/dev/null || true
            rm -rf "$ANDROID_HOME/build-cache" 2>/dev/null || true
          fi
          
          # Очищаем все возможные кэш директории
          find ~ -type d -name "*cache*" 2>/dev/null | \
          while read -r dir; do
            if [ -d "$dir" ] && [ -w "$dir" ]; then
              echo "🧹 Очистка: $dir"
              rm -rf "$dir"/* 2>/dev/null || true
            fi
          done
          
          echo "✅ Все локальные файлы очищены"

      # Принудительная очистка через GitHub CLI
      - name: 🔧 Force Clear via GitHub CLI
        run: |
          echo "🔧 Принудительная очистка через GitHub CLI..."
          
          # Получаем список кэшей через gh
          CACHE_KEYS=$(gh api repos/${{ github.repository }}/actions/caches --jq '.actions_caches[] | .key' 2>/dev/null || echo "")
          
          if [ -n "$CACHE_KEYS" ]; then
            echo "🗑️ Найдено кэшей для удаления: $(echo "$CACHE_KEYS" | wc -l)"
            
            # Удаляем каждый кэш
            while IFS= read -r key; do
              if [ -n "$key" ]; then
                echo "🗑️ Удаление кэша: $key"
                gh api repos/${{ github.repository }}/actions/caches -X DELETE --field key="$key" 2>/dev/null || echo "❌ Ошибка удаления: $key"
              fi
            done <<< "$CACHE_KEYS"
          else
            echo "ℹ️ Кэши не найдены через GitHub CLI"
          fi

      - name: ✅ Done
        run: |
          echo "✅ Очистка завершена!"
          echo "🔧 Следующий запуск будет с чистого листа"
          echo "📊 Итоговая проверка кэшей:"
          gh api repos/${{ github.repository }}/actions/caches --jq '.total_count' 2>/dev/null || echo "Не удалось проверить количество кэшей"