name: 🗑️ Clear All Caches

on:
  workflow_dispatch:

jobs:
  clear-cache:
    runs-on: ubuntu-latest
    env:
      BUILD_OPTS: >-
        -Dorg.build.daemon=false
        -Dorg.build.parallel=true
        -Dorg.build.configureondemand=true
        -Dorg.build.caching=false
        -Dorg.build.workers.max=4
        -Dorg.build.jvmargs=-Xmx2g -XX:+UseParallelGC
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # Динамическая очистка всех кэшей
      - name: 🗑️ Clear All Caches Dynamically
        run: |
          echo "🔍 Получение списка всех кэшей..."
          
          # Получаем все кэши через API
          CACHES=$(curl -s -H "Authorization: token ${{ github.token }}" \
                        -H "Accept: application/vnd.github.v3+json" \
                        "https://api.github.com/repos/${{ github.repository }}/actions/caches" | \
                   jq -r '.actions_caches[] | .key' 2>/dev/null || echo "")
          
          # Подсчитываем количество кэшей в начале
          CACHE_COUNT_BEFORE=$(echo "$CACHES" | grep -c . || echo "0")
          echo "📊 Кэшей в начале: $CACHE_COUNT_BEFORE"
          
          if [ -n "$CACHES" ]; then
            echo "🗑️ Найдено кэшей: $(echo "$CACHES" | wc -l)"
            echo "🧹 Очистка всех кэшей параллельно..."
            
            # Очищаем каждый кэш параллельно
            echo "$CACHES" | while read -r cache_key; do
              if [ -n "$cache_key" ]; then
                echo "🗑️ Очистка кэша: $cache_key"
                curl -X DELETE \
                     -H "Authorization: token ${{ github.token }}" \
                     -H "Accept: application/vnd.github.v3+json" \
                     "https://api.github.com/repos/${{ github.repository }}/actions/caches?key=$cache_key" &
              fi
            done
            
            # Ждем завершения всех запросов
            wait
            echo "✅ Все кэши очищены"
          else
            echo "ℹ️ Кэши не найдены"
          fi
          
          # Проверяем количество кэшей в конце
          echo "🔍 Проверка кэшей после очистки..."
          CACHES_AFTER=$(curl -s -H "Authorization: token ${{ github.token }}" \
                              -H "Accept: application/vnd.github.v3+json" \
                              "https://api.github.com/repos/${{ github.repository }}/actions/caches" | \
                         jq -r '.actions_caches[] | .key' 2>/dev/null || echo "")
          CACHE_COUNT_AFTER=$(echo "$CACHES_AFTER" | grep -c . || echo "0")
          echo "📊 Кэшей в конце: $CACHE_COUNT_AFTER"
          
          # Выводим результат
          if [ "$CACHE_COUNT_BEFORE" -gt 0 ] && [ "$CACHE_COUNT_AFTER" -eq 0 ]; then
            echo "🎉 Успешно очищено $CACHE_COUNT_BEFORE кэшей!"
          elif [ "$CACHE_COUNT_BEFORE" -eq 0 ]; then
            echo "ℹ️ Кэши не были найдены для очистки"
          else
            echo "⚠️ Очищено $((CACHE_COUNT_BEFORE - CACHE_COUNT_AFTER)) из $CACHE_COUNT_BEFORE кэшей"
          fi

      # Динамическая очистка локальных файлов
      - name: 🧹 Clear Local Files Dynamically
        run: |
          echo "🧹 Динамическая очистка локальных файлов..."
          
          # Очищаем все возможные кэш директории без привязки к именам
          find ~ -type d -name "*cache*" 2>/dev/null | \
          while read -r dir; do
            if [ -d "$dir" ] && [ -w "$dir" ]; then
              echo "🧹 Очистка: $dir"
              rm -rf "$dir"/* 2>/dev/null &
            fi
          done
          
          # Ждем завершения всех операций
          wait
          
          # Динамическая очистка build кэшей (если есть build файлы)
          find . -name "*build*" -type f -executable 2>/dev/null | head -1 | \
          while read -r build_file; do
            if [ -n "$build_file" ] && [ -x "$build_file" ]; then
              echo "🧹 Очистка build кэша: $build_file"
              timeout 30s "$build_file" clean --no-daemon --parallel --max-workers=2 --quiet 2>/dev/null || echo "⚠️ Build cleanup failed"
            fi
          done
          
          echo "✅ Все локальные файлы очищены"

      - name: ✅ Done
        run: |
          echo "✅ Все кэши очищены!"
          echo "🔧 Следующий запуск будет с чистого листа"