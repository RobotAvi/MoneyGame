name: 🗑️ Clear Android Cache

on:
  workflow_dispatch:

jobs:
  clear-cache:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.configureondemand=true
        -Dorg.gradle.caching=false
        -Dorg.gradle.workers.max=4
        -Dorg.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # Динамическая очистка всех кэшей
      - name: 🗑️ Clear All Caches Dynamically
        run: |
          echo "🔍 Получение списка всех кэшей..."
          
          # Получаем все кэши через API
          CACHES=$(curl -s -H "Authorization: token ${{ github.token }}" \
                        -H "Accept: application/vnd.github.v3+json" \
                        "https://api.github.com/repos/${{ github.repository }}/actions/caches" | \
                   jq -r '.actions_caches[] | .key' 2>/dev/null || echo "")
          
          if [ -n "$CACHES" ]; then
            echo "🗑️ Найдено кэшей: $(echo "$CACHES" | wc -l)"
            echo "🧹 Очистка всех кэшей параллельно..."
            
            # Очищаем каждый кэш параллельно
            echo "$CACHES" | while read -r cache_key; do
              if [ -n "$cache_key" ]; then
                echo "🗑️ Очистка кэша: $cache_key"
                curl -X DELETE \
                     -H "Authorization: token ${{ github.token }}" \
                     -H "Accept: application/vnd.github.v3+json" \
                     "https://api.github.com/repos/${{ github.repository }}/actions/caches?key=$cache_key" &
              fi
            done
            
            # Ждем завершения всех запросов
            wait
            echo "✅ Все кэши очищены"
          else
            echo "ℹ️ Кэши не найдены"
          fi

      # Динамическая очистка локальных файлов
      - name: 🧹 Clean Local Files Dynamically
        run: |
          echo "🧹 Динамическая очистка локальных файлов..."
          
          # Очищаем все возможные кэш директории без привязки к именам
          find ~ -type d -name "*cache*" 2>/dev/null | \
          while read -r dir; do
            if [ -d "$dir" ] && [ -w "$dir" ]; then
              echo "🧹 Очистка: $dir"
              rm -rf "$dir"/* 2>/dev/null &
            fi
          done
          
          # Ждем завершения всех операций
          wait
          
          # Динамическая очистка build кэшей (если есть build файлы)
          find . -name "*build*" -type f -executable 2>/dev/null | head -1 | \
          while read -r build_file; do
            if [ -n "$build_file" ] && [ -x "$build_file" ]; then
              echo "🧹 Очистка build кэша: $build_file"
              timeout 30s "$build_file" clean cleanBuildCache --no-daemon --parallel --max-workers=2 --quiet 2>/dev/null || echo "⚠️ Build cleanup failed"
            fi
          done
          
          echo "✅ Все локальные файлы очищены"

      - name: ✅ Done
        run: |
          echo "✅ Все кэши очищены!"
          echo "🔧 Следующий запуск будет с чистого листа"