name: 🤖 Android CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'releases/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # Используем кеш Gradle внутри action-gradle
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    runs-on: ubuntu-22.04   # надёжнее, чем ubuntu-latest/24.04 для эмуляторов

    steps:
      # 1. Клонируем код
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # 2. Ставим JDK 17 (минимум для AGP 8.2)
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: gradle            # кеш в action-gradle

      # 3. Кешируем Gradle и ускоряем конфигурацию
      - name: 🏗️ Setup Gradle
        uses: gradle/actions/setup-gradle@v3   # <https://github.com/gradle/gradle-build-action>

      # 3.1 Подготовить переменные версии для CI
      - name: 🔖 Compute CI version
        id: version
        run: |
          CURR_VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          CURR_CODE=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle)
          MAJOR=$(echo $CURR_VERSION | cut -d. -f1)
          MINOR=$(echo $CURR_VERSION | cut -d. -f2)
          if [ -z "$MINOR" ]; then MINOR=0; fi
          echo "CI_VERSION_NAME=$MAJOR.$((MINOR+1))" >> $GITHUB_ENV
          echo "CI_VERSION_CODE=$((CURR_CODE+1))" >> $GITHUB_ENV

      # 4. Делаем сборку и юнит-тесты
      - name: 🔨 Assemble & Unit tests
        run: ./gradlew clean :app:assembleDebug testDebugUnitTest --no-configuration-cache

      # 5. Загружаем APK артефактом
      - name: 📦 Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FinancialSuccess-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk